services:
  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development

  worker:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm worker:dev"
    environment:
      NODE_ENV: development
      MARKETING_WORKER_PORT: 4317
