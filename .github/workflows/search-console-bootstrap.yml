name: Search Console health check

on:
  schedule:
    # Evidence-derived primary window. GitHub scheduled workflows can be delayed or dropped under load;
    # this earlier slot preserves several hours of latency buffer before the SEO decision window.
    - cron: '37 0 * * *'
    # Independent fallback using the same two-run ceiling as before; concurrency prevents overlap.
    - cron: '37 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ai-marketing/gsc-url-prefix-bootstrap.mjs'
      - 'tools/ai-marketing/gsc-fetch-private.mjs'
      - 'tools/ai-marketing/gsc-evidence-gate.mjs'
      - 'tools/ai-marketing/gsc-index-inspection.mjs'
      - 'tools/ai-marketing/gsc-index-priority.mjs'
      - 'tools/ai-marketing/gsc-encrypt-private.mjs'
      - 'tools/ai-marketing/gsc-encrypt-private.test.mjs'
      - 'tools/ai-marketing/gsc-safe-snapshot.mjs'
      - 'tools/ai-marketing/gsc-evidence-public.pem'
      - 'public/seo-system-version.json'
      - '.github/workflows/search-console-bootstrap.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: search-console-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GSC_SITE_URL: https://youraicoach.life/
      GSC_PRIVATE_ARTIFACT_NAME: private-gsc-evidence-v1
      GSC_PRIVATE_ARTIFACT_FILE: private-gsc-evidence.json
      GSC_PRIVATE_ARTIFACT_RETENTION_DAYS: 14

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require verified Search Console owner or full-user access
        id: status
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/ai-marketing/gsc-url-prefix-bootstrap.mjs status

      - name: Require the verified production marker
        env:
          STATUS_READY: ${{ steps.status.outputs.ready }}
          STATUS_STATUS: ${{ steps.status.outputs.status }}
        run: |
          set -euo pipefail
          [ "${STATUS_READY}" = "true" ]
          [ "${STATUS_STATUS}" = "verified" ]
          node - <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync('public/seo-system-version.json', 'utf8'));
          if (marker.searchConsoleVerified !== true) throw new Error('Search Console production marker is not verified');
          if (marker.searchConsoleProperty !== 'https://youraicoach.life/') throw new Error('Unexpected Search Console property');
          console.log('Verified Search Console production marker.');
          NODE

      - name: Retrieve private query and page evidence
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: pnpm gsc

      - name: Emit encrypted private evidence envelope
        id: encrypted
        run: |
          set -euo pipefail
          envelope="$RUNNER_TEMP/$GSC_PRIVATE_ARTIFACT_FILE"
          node tools/ai-marketing/gsc-encrypt-private.mjs --output "$envelope"
          node --input-type=module - "$envelope" <<'NODE'
          import fs from 'node:fs';
          const envelopePath = process.argv[2];
          const envelope = JSON.parse(fs.readFileSync(envelopePath, 'utf8'));
          if (envelope.version !== 1) throw new Error('Unexpected encrypted evidence envelope version');
          if (envelope.algorithm !== 'RSA-OAEP-SHA256+AES-256-GCM') throw new Error('Unexpected encrypted evidence algorithm');
          if (!Number.isInteger(envelope.rowCount) || envelope.rowCount < 0) throw new Error('Invalid encrypted evidence row count');
          if (!/^[a-f0-9]{64}$/.test(envelope.publicKeySha256 || '')) throw new Error('Invalid encrypted evidence key fingerprint');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `row_count=${envelope.rowCount}`,
            `start_date=${envelope.reportPeriod.startDate}`,
            `end_date=${envelope.reportPeriod.endDate}`,
            `fingerprint=${envelope.publicKeySha256}`,
          ].join('\n') + '\n');
          console.log(`Encrypted artifact envelope validated: ${envelope.rowCount} row(s).`);
          NODE

      - name: Upload encrypted private evidence artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.GSC_PRIVATE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.GSC_PRIVATE_ARTIFACT_FILE }}
          if-no-files-found: error
          retention-days: ${{ env.GSC_PRIVATE_ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

      - name: Evaluate the private evidence state
        id: evidence
        run: pnpm gsc:evidence

      - name: Inspect Google index status for priority URLs
        id: index
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/ai-marketing/gsc-index-inspection.mjs

      - name: Summarize Search Console health without exposing queries
        env:
          EVIDENCE_ROW_COUNT: ${{ steps.evidence.outputs.row_count || '0' }}
          EVIDENCE_EVIDENCE_AVAILABLE: ${{ steps.evidence.outputs.evidence_available || 'false' }}
          INDEX_INSPECTED_COUNT: ${{ steps.index.outputs.inspected_count || '0' }}
          INDEX_INDEXED_COUNT: ${{ steps.index.outputs.indexed_count || '0' }}
          INDEX_NOT_INDEXED_COUNT: ${{ steps.index.outputs.not_indexed_count || '0' }}
          INDEX_UNKNOWN_COUNT: ${{ steps.index.outputs.unknown_count || '0' }}
          INDEX_API_ERROR_COUNT: ${{ steps.index.outputs.api_error_count || '0' }}
          ARTIFACT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ENCRYPTED_ROW_COUNT: ${{ steps.encrypted.outputs.row_count || '0' }}
        run: |
          {
            echo "### Search Console health"
            echo "- Ownership/API access: verified"
            echo "- Property: https://youraicoach.life/"
            echo "- Private query+page rows: ${EVIDENCE_ROW_COUNT}"
            echo "- Evidence-backed publisher available: ${EVIDENCE_EVIDENCE_AVAILABLE}"
            echo "- Priority URLs inspected: ${INDEX_INSPECTED_COUNT}"
            echo "- Priority URLs indexed: ${INDEX_INDEXED_COUNT}"
            echo "- Priority URLs not indexed: ${INDEX_NOT_INDEXED_COUNT}"
            echo "- Priority URLs unknown: ${INDEX_UNKNOWN_COUNT}"
            echo "- URL Inspection API errors: ${INDEX_API_ERROR_COUNT}"
            echo "- Encrypted exact-query artifact: $GSC_PRIVATE_ARTIFACT_NAME"
            echo "- Encrypted artifact ID: ${ARTIFACT_ARTIFACT_ID}"
            echo "- Encrypted artifact rows: ${ENCRYPTED_ROW_COUNT}"
            echo "- Exact queries: encrypted for private SEO review; plaintext is not printed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist latest public-safe Search Console snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ENCRYPTED_ROW_COUNT: ${{ steps.encrypted.outputs.row_count }}
          ENCRYPTED_START_DATE: ${{ steps.encrypted.outputs.start_date }}
          ENCRYPTED_END_DATE: ${{ steps.encrypted.outputs.end_date }}
          ENCRYPTED_FINGERPRINT: ${{ steps.encrypted.outputs.fingerprint }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/gsc-safe-snapshot.md"
          node tools/ai-marketing/gsc-safe-snapshot.mjs --output "$snapshot"

          {
            echo "## Private exact-query handoff"
            echo
            echo "- Encrypted artifact: \`$GSC_PRIVATE_ARTIFACT_NAME\`"
            echo "- Artifact ID: \`${ARTIFACT_ARTIFACT_ID}\`"
            echo "- Artifact URL: ${ARTIFACT_ARTIFACT_URL}"
            echo "- Artifact SHA-256 digest: \`${ARTIFACT_ARTIFACT_DIGEST}\`"
            echo "- Artifact file: \`$GSC_PRIVATE_ARTIFACT_FILE\`"
            echo "- Artifact retention: $GSC_PRIVATE_ARTIFACT_RETENTION_DAYS days"
            echo "- Envelope rows: ${ENCRYPTED_ROW_COUNT}"
            echo "- Envelope period: ${ENCRYPTED_START_DATE} to ${ENCRYPTED_END_DATE}"
            echo "- Public-key fingerprint: \`${ENCRYPTED_FINGERPRINT}\`"
            echo "- Plaintext key and decryptor: connected private evidence vault only"
            echo
            echo "The artifact contains ciphertext only. The private SEO process must verify artifact digest, key fingerprint, authenticated decryption, row count, and reporting period before using exact queries."
            echo
          } >> "$snapshot"

          title="[SEO Observability] Latest Search Console safe snapshot"
          issue=$(gh issue list --state all --limit 100 --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue reopen "$issue" >/dev/null 2>&1 || true
            gh issue edit "$issue" --title "$title" --body-file "$snapshot"
          else
            gh issue create --title "$title" --body-file "$snapshot"
          fi

      - name: Open or update one health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="[SEO Automation] Search Console health check failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Search Console ownership, marker, private query+page retrieval, encrypted artifact generation/upload, priority URL index inspection, or safe snapshot persistence failed. Review ${run_url}. No plaintext private query is included."
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a recovered health issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[SEO Automation] Search Console health check failed"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Search Console health recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

      - name: Delete local plaintext Search Console and decision evidence
        if: always()
        run: |
          rm -rf -- tools/ai-marketing/search-console-reports/ data/marketing-employee/seo-growth/
          rm -f -- /tmp/seo-base-planner.log /tmp/izem-seo-smoke-plan.json
