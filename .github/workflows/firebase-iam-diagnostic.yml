name: Firebase IAM diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-iam-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check existing Google Cloud credential permissions
        env:
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CLOUD_JSON:-}" ]; then
            echo "::error::GOOGLE_CLOUD_JSON is not configured."
            exit 1
          fi

          key="$RUNNER_TEMP/gcloud.json"
          printf '%s' "$GOOGLE_CLOUD_JSON" > "$key"
          chmod 600 "$key"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(v.type!=='service_account'||!v.client_email||!v.private_key)process.exit(2)" "$key"

          gcloud auth activate-service-account --key-file="$key" --quiet >/dev/null
          project="ai-gym-coach-13ee1"
          token="$(gcloud auth print-access-token)"

          payload='{"permissions":["resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","firebasehosting.sites.list","firebasehosting.sites.update","firebasehosting.versions.create","firebasehosting.releases.create"]}'
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$project:testIamPermissions")"

          node - "$response" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          const allowed = new Set(response.permissions || []);
          const checks = [
            'resourcemanager.projects.getIamPolicy',
            'resourcemanager.projects.setIamPolicy',
            'firebasehosting.sites.list',
            'firebasehosting.sites.update',
            'firebasehosting.versions.create',
            'firebasehosting.releases.create',
          ];
          for (const permission of checks) {
            console.log(permission + '=' + (allowed.has(permission) ? 'allowed' : 'denied'));
          }
          NODE

          rm -f "$key"
