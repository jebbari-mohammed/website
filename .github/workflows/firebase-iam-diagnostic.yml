name: Firebase IAM diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-iam-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect existing Google Cloud deploy principal
        env:
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CLOUD_JSON:-}" ]; then
            echo "::error::GOOGLE_CLOUD_JSON is not configured."
            exit 1
          fi

          key="$RUNNER_TEMP/gcloud.json"
          printf '%s' "$GOOGLE_CLOUD_JSON" > "$key"
          chmod 600 "$key"
          email="$(node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(v.type!=='service_account'||!v.client_email||!v.private_key)process.exit(2);process.stdout.write(v.client_email)" "$key")"

          gcloud auth activate-service-account --key-file="$key" --quiet >/dev/null 2>&1
          project="ai-gym-coach-13ee1"

          if roles="$(gcloud projects get-iam-policy "$project" \
            --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:$email" \
            --format="value(bindings.role)" 2>/tmp/iam-error)"; then
            if [ -n "$roles" ]; then
              echo "Assigned project roles for the configured principal:"
              printf '%s\n' "$roles"
            else
              echo "Assigned project roles for the configured principal: none found."
            fi
          else
            echo "Project IAM policy read: denied."
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[service-account]/g' /tmp/iam-error | tail -n 8
          fi

          echo "Firebase Hosting permission probe:"
          set +e
          GOOGLE_APPLICATION_CREDENTIALS="$key" firebase hosting:sites:list --project "$project" --json >/tmp/hosting-out 2>/tmp/hosting-error
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "firebasehosting.sites.list=allowed"
          else
            echo "firebasehosting.sites.list=denied"
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[service-account]/g' /tmp/hosting-error | tail -n 8
          fi

          rm -f "$key" /tmp/iam-error /tmp/hosting-out /tmp/hosting-error
