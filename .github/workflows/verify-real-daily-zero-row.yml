name: Verify real daily zero-row production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-real-daily-zero-row.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: verify-real-daily-zero-row-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Dispatch the exact production workflow as a dry run
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output=$(gh workflow run daily-blog.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=true -f force=false 2>&1)
          printf '%s\n' "$output"
          run_url=$(printf '%s\n' "$output" | grep -Eo 'https://github\.com/[^[:space:]]+/actions/runs/[0-9]+' | tail -n1)
          [ -n "$run_url" ] || { echo "::error::The dispatch command returned no workflow-run URL"; exit 1; }
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched Daily SEO Production run $run_id."

      - name: Require the real workflow to complete successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5

      - name: Prove the minimal evidence gate skipped compute, AI, and publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="${{ steps.dispatch.outputs.run_id }}"
          jobs=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs)
          echo "$jobs" | jq -e '
            .jobs[]
            | select(.name == "Evidence-driven SEO action")
            | (.steps | map({key: .name, value: .conclusion}) | from_entries) as $steps
            | $steps["Check whether Search Console production access is verified"] == "success"
              and $steps["Verify the private Search Console credential"] == "success"
              and $steps["Pull private Search Console query and landing-page evidence"] == "success"
              and $steps["Evaluate whether private Search Console evidence is available"] == "success"
              and $steps["Report a verified zero-row no-action run"] == "success"
              and $steps["Verify Gemini credentials only when evidence exists"] == "skipped"
              and $steps["Restore private experiment and cooldown state"] == "skipped"
              and $steps["Run deterministic SEO tests"] == "skipped"
              and $steps["Build private base opportunity plan"] == "skipped"
              and $steps["Verify current Gemini SDK, keys, and model fallback"] == "skipped"
              and $steps["Research, draft, critique, validate, and prepare the best action"] == "skipped"
              and $steps["Commit only public website files"] == "skipped"
          ' >/dev/null
          echo "Real daily workflow verified: only Search Console retrieval and the evidence gate ran; cache, tests, Gemini, planning, publishing, deployment, and commits were skipped."
