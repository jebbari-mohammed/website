name: Rebuild Source Blog Index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-blog-index-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Rebuild source blog index, RSS, and sitemap
        run: |
          set -euo pipefail
          node tools/ai-marketing/rebuild-blog-index.mjs
          node tools/sync-sitemap.mjs
          node tools/validate-jsonld.mjs public

      - name: Commit only derived discovery files
        run: |
          set -euo pipefail
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add public/blog/index.html public/blog/feed.xml public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Source discovery files are already synchronized."
            exit 0
          fi
          git commit -m "chore: rebuild source blog discovery files"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
