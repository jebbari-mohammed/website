name: Rebuild Blog Index

on:
  push:
    branches: [main]
    paths:
      - 'public/blog/**'
      - '!public/blog/index.html'
      - '!public/blog/feed.xml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "blog-index-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild blog index
        run: node tools/ai-marketing/rebuild-blog-index.mjs

      - name: Commit index rebuild
        run: |
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add public/blog/index.html public/blog/feed.xml
          if git diff --staged --quiet; then
            echo "No changes to index"
          else
            git commit -m "🔄 Auto-rebuild blog index"
            git pull --rebase origin main || true
            git push
          fi

      - name: Trigger Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main
