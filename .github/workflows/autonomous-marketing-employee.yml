name: Autonomous Marketing Employee Daily Run

on:
  # Publishes generated dashboard/report data once at a randomized time between
  # 06:00 and 13:00 UTC.
  schedule:
    - cron: '13 6 * * *'
    - cron: '13 7 * * *'
    - cron: '13 8 * * *'
    - cron: '13 9 * * *'
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    - cron: '13 12 * * *'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-marketing-employee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Select today's randomized publication time
        id: timing
        run: node tools/ai-marketing/publication-window.mjs --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" --base-hour 6 --salt marketing-employee

      - name: Wait until the selected publication time
        if: github.event_name == 'schedule' && steps.timing.outputs.publish == 'true'
        run: sleep "${{ steps.timing.outputs.wait_seconds }}"

      - name: Install pnpm
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run Marketing Tasks
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          # API Keys from GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          
          # Configurations
          MARKETING_LLM_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash
          CI: true
        run: |
          echo "🔍 Running Site Audit..."
          pnpm audit:site
          
          echo "📈 Generating Keyword Roadmap..."
          pnpm keywords:generate
          
          echo "✍️ Creating Blog Draft..."
          pnpm blog:create
          
          echo "📱 Repurposing Content for Socials..."
          pnpm social:repurpose -- --postiz=true
          
          echo "📊 Generating Weekly Summary..."
          pnpm report:weekly

      - name: Commit and Push Generated Data (Force-Adding Ignored Artifacts)
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: |
          git config user.name "IZEM Marketing Agent"
          git config user.email "marketing-agent@youraicoach.life"
          
          # Force add the generated files because data/ and public/marketing-data/ are gitignored locally
          git add -f data/marketing-employee/
          git add -f public/marketing-data/
          
          if git diff --staged --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "🤖 Auto-run: Generated marketing drafts & dashboard snapshot [skip ci]"
            
            # Pull latest remote changes to prevent conflicts, then push
            git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi

      - name: Trigger static Pages Deployment
        if: success() && (github.event_name != 'schedule' || steps.timing.outputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main
