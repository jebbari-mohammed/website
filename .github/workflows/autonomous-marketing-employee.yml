name: Weekly Marketing Health Report

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-marketing-health
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit the live site and produce a weekly operational report
        run: |
          set -euo pipefail
          pnpm audit:site -- --url=https://youraicoach.life --max-pages=100
          pnpm report:weekly

      - name: Verify this workflow produced no autonomous content drafts
        run: |
          set -euo pipefail
          if git status --short | grep -E 'data/marketing-employee/(drafts|calendars|roadmaps|seo-growth)|public/blog/'; then
            echo "::error::The analytics workflow attempted to create editorial content"
            exit 1
          fi

      - name: Commit only sanitized audit and dashboard artifacts
        run: |
          set -euo pipefail
          git config user.name "IZEM Marketing Health"
          git config user.email "marketing-health@youraicoach.life"
          git add -f data/marketing-employee/audits/ data/marketing-employee/reports/ public/marketing-data/ 2>/dev/null || true
          git reset -- data/marketing-employee/seo-growth/ data/marketing-employee/drafts/ data/marketing-employee/calendars/ data/marketing-employee/roadmaps/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No sanitized weekly artifacts changed."
            exit 0
          fi
          git commit -m "chore: weekly marketing health report"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
