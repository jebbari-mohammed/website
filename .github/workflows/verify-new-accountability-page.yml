name: Verify new accountability page is live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-new-accountability-page.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Request a deployment of latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Poll the public page until it is live
        id: smoke
        continue-on-error: true
        run: |
          set +e
          report=/tmp/new-accountability-page-live.txt
          : > "$report"
          echo "checked_at_start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$report"
          echo "source_commit=$(git rev-parse HEAD)" >> "$report"

          page_url='https://youraicoach.life/blog/app-to-keep-me-accountable-for-working-out'
          html_url='https://youraicoach.life/blog/app-to-keep-me-accountable-for-working-out.html'
          sitemap_url='https://youraicoach.life/sitemap.xml'
          blog_url='https://youraicoach.life/blog/'
          success=0

          for attempt in $(seq 1 30); do
            echo "attempt=$attempt" >> "$report"
            page_ok=1

            for url in "$page_url" "$html_url"; do
              body=$(mktemp)
              code=$(curl -L -sS --max-time 30 -o "$body" -w '%{http_code}' "$url")
              final=$(curl -L -sS --max-time 30 -o /dev/null -w '%{url_effective}' "$url")
              title=$(grep -io '<title>[^<]*</title>' "$body" | head -1 | sed -E 's#</?title>##Ig')
              article_match=no
              grep -qi 'Need an app to keep you accountable for working out' "$body" && article_match=yes
              not_found_match=no
              grep -qi 'Page not found' "$body" && not_found_match=yes
              echo "url=$url status=$code final_url=$final article_match=$article_match not_found_match=$not_found_match title=$title" >> "$report"
              if [ "$code" != "200" ] || [ "$article_match" != "yes" ] || [ "$not_found_match" = "yes" ]; then
                page_ok=0
              fi
              rm -f "$body"
            done

            sitemap_body=$(mktemp)
            sitemap_code=$(curl -L -sS --max-time 30 -o "$sitemap_body" -w '%{http_code}' "$sitemap_url")
            sitemap_match=no
            grep -q 'https://youraicoach.life/blog/app-to-keep-me-accountable-for-working-out' "$sitemap_body" && sitemap_match=yes
            echo "sitemap_status=$sitemap_code sitemap_match=$sitemap_match" >> "$report"
            [ "$sitemap_code" = "200" ] && [ "$sitemap_match" = "yes" ] || page_ok=0
            rm -f "$sitemap_body"

            blog_body=$(mktemp)
            blog_code=$(curl -L -sS --max-time 30 -o "$blog_body" -w '%{http_code}' "$blog_url")
            blog_match=no
            grep -q '/blog/app-to-keep-me-accountable-for-working-out' "$blog_body" && blog_match=yes
            echo "blog_index_status=$blog_code blog_index_match=$blog_match" >> "$report"
            [ "$blog_code" = "200" ] && [ "$blog_match" = "yes" ] || page_ok=0
            rm -f "$blog_body"

            if [ "$page_ok" -eq 1 ]; then
              success=1
              break
            fi
            sleep 20
          done

          echo "checked_at_end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$report"
          echo "live_success=$success" >> "$report"
          cat "$report"
          test "$success" -eq 1

      - name: Record the live verification and remove this one-time workflow
        if: always()
        run: |
          mkdir -p .github/diagnostics
          cp /tmp/new-accountability-page-live.txt .github/diagnostics/new-accountability-page-live.txt
          rm .github/workflows/verify-new-accountability-page.yml
          git config user.name "IZEM Deployment Verification"
          git config user.email "verification@youraicoach.life"
          git add .github/diagnostics/new-accountability-page-live.txt .github/workflows/verify-new-accountability-page.yml
          git commit -m "chore: record live accountability page verification [skip ci]"
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push origin HEAD:main

      - name: Fail if the page never became live
        if: steps.smoke.outcome == 'failure'
        run: exit 1
