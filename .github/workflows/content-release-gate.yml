name: Content release gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test fail-closed behavior (synthetic fixtures; no provider calls)
        run: node --test tools/content-release-gate.test.mjs
      - name: Install existing HTML parser dependency
        run: npm ci --ignore-scripts
      - name: Check three-layer release evidence
        run: node tools/content-release-gate.mjs check
