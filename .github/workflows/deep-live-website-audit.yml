name: One-time deep live website audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-live-website-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Crawl and score the live website
        run: |
          set -euo pipefail
          mkdir -p /tmp/deep-audit
          pnpm audit:site -- --url=https://youraicoach.life --max-pages=500 | tee /tmp/deep-audit/site-audit-cli.txt
          latest=$(find data/marketing-employee/audits -type f -name '*-site-audit.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$latest"
          cp "$latest" /tmp/deep-audit/site-audit.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/deep-audit/site-audit.json', 'utf8'));
          console.log('\n=== CRAWL AUDIT SUMMARY ===');
          console.log(JSON.stringify(audit.summary, null, 2));
          const order = { high: 0, medium: 1, low: 2 };
          const issues = [...audit.issues].sort((a, b) => order[a.severity] - order[b.severity]);
          for (const item of issues.slice(0, 100)) {
            console.log(`${item.severity.toUpperCase()} | ${item.title} | ${item.url} | ${item.detail}`);
          }
          NODE

      - name: Verify every sitemap URL live
        env:
          AUDIT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { setTimeout: sleep } = require('timers/promises');
          const run = process.env.AUDIT_RUN;
          const origin = 'https://youraicoach.life';
          const output = '/tmp/deep-audit/sitemap-live-check.json';

          async function fetchText(url, init = {}) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 25000);
                const response = await fetch(url, { redirect: 'follow', signal: controller.signal, headers: { 'cache-control': 'no-cache', ...init.headers } });
                clearTimeout(timer);
                const text = await response.text();
                if (response.status >= 500 && attempt < 3) { await sleep(800 * attempt); continue; }
                return { status: response.status, text, finalUrl: response.url };
              } catch (error) {
                last = error;
                if (attempt < 3) await sleep(800 * attempt);
              }
            }
            return { status: 0, text: '', finalUrl: url, error: String(last) };
          }

          const sitemap = await fetchText(`${origin}/sitemap.xml?deep_audit=${run}`);
          if (sitemap.status !== 200) throw new Error(`Sitemap HTTP ${sitemap.status}`);
          const urls = [...sitemap.text.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].trim());
          const results = [];
          let index = 0;
          async function worker() {
            while (true) {
              const i = index++;
              if (i >= urls.length) return;
              const url = urls[i];
              const separator = url.includes('?') ? '&' : '?';
              const result = await fetchText(`${url}${separator}deep_audit=${run}`);
              const notFound = /Page not found|<title>404|404 -/i.test(result.text);
              const placeholder = /Training that keeps up with real life\.|We consolidated this comparison/i.test(result.text);
              results.push({ url, status: result.status, bytes: Buffer.byteLength(result.text), finalUrl: result.finalUrl, notFound, placeholder, error: result.error });
            }
          }
          await Promise.all(Array.from({ length: 10 }, worker));
          results.sort((a, b) => a.url.localeCompare(b.url));
          fs.writeFileSync(output, JSON.stringify({ checked: urls.length, results }, null, 2));
          const failures = results.filter(r => r.status !== 200 || r.notFound || r.placeholder || r.bytes < 80);
          console.log(`\n=== SITEMAP LIVE CHECK: ${urls.length} URLs ===`);
          for (const item of failures) console.log(`FAIL | ${item.status} | ${item.bytes} bytes | notFound=${item.notFound} placeholder=${item.placeholder} | ${item.url}`);
          console.log(`Failures: ${failures.length}`);
          if (failures.length) process.exit(1);
          NODE

      - name: Browser runtime, media and layout audit
        env:
          AUDIT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer');
          const run = process.env.AUDIT_RUN;
          const base = 'https://youraicoach.life';
          const paths = [
            '/', '/best-ai-fitness-app', '/blog/', '/youtube/', '/tools/', '/comparisons/',
            '/privacy-policy.html', '/terms.html', '/support.html', '/izem-ai-fitness-coach/',
            '/blog/chatgpt-vs-fitness-app-workouts', '/youtube/a_jG-ssT1tk/',
            '/features/ai-voice-calls', '/features/ai-workout-generator', '/landing-page'
          ];
          const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
          const results = [];
          for (const route of paths) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('requestfailed', request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || 'failed' }));
            const separator = route.includes('?') ? '&' : '?';
            const url = `${base}${route}${separator}deep_audit=${run}`;
            let status = 0;
            let navigationError = '';
            const started = Date.now();
            try {
              const response = await page.goto(url, { waitUntil: 'networkidle2', timeout: 45000 });
              status = response?.status() || 0;
              await new Promise(resolve => setTimeout(resolve, 1200));
            } catch (error) {
              navigationError = error.message;
            }
            const data = await page.evaluate(() => {
              const brokenImages = [...document.images].filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src);
              const videos = [...document.querySelectorAll('video')].map(v => ({ src: v.currentSrc || v.src, readyState: v.readyState, networkState: v.networkState, error: v.error?.message || '' }));
              const iframes = [...document.querySelectorAll('iframe')].map(f => ({ src: f.src, width: f.getBoundingClientRect().width, height: f.getBoundingClientRect().height }));
              return {
                title: document.title,
                h1: [...document.querySelectorAll('h1')].map(x => x.textContent.trim()),
                bodyText: document.body?.innerText?.slice(0, 500) || '',
                bodyWidth: document.body?.scrollWidth || 0,
                viewportWidth: document.documentElement.clientWidth,
                horizontalOverflow: (document.body?.scrollWidth || 0) > document.documentElement.clientWidth + 4,
                brokenImages,
                videos,
                iframes,
              };
            });
            const screenshotName = route === '/' ? 'home' : route.replace(/^\/+|\/+$/g, '').replace(/[^a-z0-9]+/gi, '-') || 'home';
            await page.screenshot({ path: `/tmp/deep-audit/${screenshotName}.png`, fullPage: true });
            results.push({ route, url, status, loadMs: Date.now() - started, navigationError, consoleErrors, pageErrors, failedRequests, ...data });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('/tmp/deep-audit/browser-runtime.json', JSON.stringify(results, null, 2));
          console.log('\n=== BROWSER RUNTIME AUDIT ===');
          let failures = 0;
          for (const item of results) {
            const meaningfulFailed = item.failedRequests.filter(r => !/google-analytics|googletagmanager/i.test(r.url));
            const bad = item.status !== 200 || item.navigationError || item.pageErrors.length || item.consoleErrors.length || item.brokenImages.length || item.horizontalOverflow || meaningfulFailed.length;
            if (bad) failures++;
            console.log(`${bad ? 'ISSUE' : 'PASS'} | ${item.status} | ${item.loadMs}ms | overflow=${item.horizontalOverflow} brokenImages=${item.brokenImages.length} console=${item.consoleErrors.length} pageErrors=${item.pageErrors.length} failedRequests=${meaningfulFailed.length} | ${item.route}`);
            for (const value of item.brokenImages) console.log(`  broken image: ${value}`);
            for (const value of item.consoleErrors.slice(0, 5)) console.log(`  console: ${value}`);
            for (const value of item.pageErrors.slice(0, 5)) console.log(`  pageerror: ${value}`);
            for (const value of meaningfulFailed.slice(0, 5)) console.log(`  request: ${value.error} ${value.url}`);
          }
          console.log(`Routes with runtime/layout findings: ${failures}/${results.length}`);
          NODE

      - name: Lighthouse key pages
        run: |
          set -euo pipefail
          for spec in \
            'home|https://youraicoach.life/' \
            'best-ai-fitness-app|https://youraicoach.life/best-ai-fitness-app' \
            'blog|https://youraicoach.life/blog/' \
            'youtube|https://youraicoach.life/youtube/'; do
            name=${spec%%|*}
            url=${spec#*|}
            npx --yes lighthouse@12.8.2 "$url" \
              --output=json \
              --output-path="/tmp/deep-audit/lighthouse-${name}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          console.log('\n=== LIGHTHOUSE MOBILE SUMMARY ===');
          for (const file of fs.readdirSync('/tmp/deep-audit').filter(x => x.startsWith('lighthouse-') && x.endsWith('.json')).sort()) {
            const report = JSON.parse(fs.readFileSync(`/tmp/deep-audit/${file}`, 'utf8'));
            const c = report.categories;
            const a = report.audits;
            const score = key => Math.round((c[key]?.score ?? 0) * 100);
            console.log(`${file.replace('lighthouse-', '').replace('.json', '')}: performance=${score('performance')} accessibility=${score('accessibility')} best-practices=${score('best-practices')} seo=${score('seo')}`);
            for (const key of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','server-response-time','total-byte-weight']) {
              if (a[key]) console.log(`  ${key}: ${a[key].displayValue || a[key].numericValue}`);
            }
            const failed = Object.values(a).filter(x => x.score !== null && x.score < 1 && x.scoreDisplayMode === 'binary').sort((x, y) => (x.score ?? 0) - (y.score ?? 0));
            for (const item of failed.slice(0, 12)) console.log(`  failed: ${item.id} — ${item.title}`);
          }
          NODE

      - name: Security and caching headers
        run: |
          set -euo pipefail
          for url in \
            https://youraicoach.life/ \
            https://youraicoach.life/best-ai-fitness-app \
            https://youraicoach.life/youtube/ \
            https://youraicoach.life/privacy-policy.html; do
            echo "\n=== $url ==="
            curl -sSIL --max-time 30 "$url" | grep -Ei '^(HTTP/|content-type:|content-length:|cache-control:|content-security-policy:|strict-transport-security:|x-content-type-options:|x-frame-options:|referrer-policy:|permissions-policy:|content-encoding:|location:)' || true
          done

      - name: Upload deep audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-live-website-audit
          path: /tmp/deep-audit
          retention-days: 7
