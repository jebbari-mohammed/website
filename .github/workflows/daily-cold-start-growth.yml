name: Cold-Start SEO Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect cold-start SEO opportunities without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GSC_SITE_URL: https://youraicoach.life/
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require verified Search Console production access
        id: ready
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync('public/seo-system-version.json', 'utf8'));
          const ready = marker.searchConsoleVerified === true && marker.searchConsoleProperty === 'https://youraicoach.life/';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready ? 'true' : 'false'}\n`);
          if (!ready) console.log('Search Console is not production-ready; diagnostic changes are withheld.');
          NODE

      - name: Pull private Search Console evidence
        if: steps.ready.outputs.ready == 'true'
        run: pnpm gsc

      - name: Decide whether evidence exists
        id: evidence
        if: steps.ready.outputs.ready == 'true'
        run: pnpm gsc:evidence

      - name: Test deterministic cold-start selection and idempotency
        if: steps.ready.outputs.ready == 'true' && steps.evidence.outputs.evidence_available != 'true'
        run: pnpm test:cold-start

      - name: Preview the next cold-start internal-link action
        id: growth
        if: steps.ready.outputs.ready == 'true' && steps.evidence.outputs.evidence_available != 'true'
        run: node tools/ai-marketing/cold-start-growth.mjs --dry-run

      - name: Run the live technical audit
        if: steps.ready.outputs.ready == 'true' && steps.evidence.outputs.evidence_available != 'true'
        run: pnpm audit:site -- --url=https://youraicoach.life --max-pages=100

      - name: Validate crawl and indexability guardrails
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --strict
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

      - name: Report the diagnostic
        if: always()
        run: |
          {
            echo "### Cold-start SEO diagnostic"
            echo "- Search Console ready: ${{ steps.ready.outputs.ready || 'false' }}"
            echo "- Private query+page rows: ${{ steps.evidence.outputs.row_count || '0' }}"
            echo "- Evidence available: ${{ steps.evidence.outputs.evidence_available || 'false' }}"
            echo "- Preview action: ${{ steps.growth.outputs.action || 'none' }}"
            echo "- Preview target: ${{ steps.growth.outputs.target_url || 'none' }}"
            echo "- Public SEO change: none"
            echo "- Autonomous publishing: disabled"
            echo "- Decision owner: ChatGPT senior SEO lead"
          } >> "$GITHUB_STEP_SUMMARY"
