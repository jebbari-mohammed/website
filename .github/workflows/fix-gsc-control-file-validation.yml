name: Fix Google control-file validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-gsc-control-file-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-google-control-file-validation
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude only valid Google FILE tokens from webpage quality rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/check-links.mjs')
          source = path.read_text()
          old = """const files = await collectFiles(distDirectory)
          const allFiles = new Set(files)
          const htmlFiles = files.filter(
            (file) => file.endsWith('.html') && !file.startsWith(excludedDirectory),
          )
          """
          new = """const files = await collectFiles(distDirectory)
          const allFiles = new Set(files)

          function isInfrastructureHtml(file) {
            // Google FILE verification tokens must contain only the exact token text.
            // They are deployable control files, not branded/indexable webpages.
            return /^google[A-Za-z0-9_-]+\\.html$/.test(path.posix.basename(file))
          }

          const htmlFiles = files.filter(
            (file) =>
              file.endsWith('.html') &&
              !file.startsWith(excludedDirectory) &&
              !isInfrastructureHtml(file),
          )
          """
          if source.count(old) != 1:
              raise SystemExit('Expected check-links file-selection block exactly once')
          path.write_text(source.replace(old, new))
          PY
          node --check tools/check-links.mjs

      - name: Prove the real official token survives the full production build and quality suite
        run: |
          set -euo pipefail
          token=googlecbf3623a1a73c321.html
          test -f "public/$token"
          test "$(tr -d '\r\n' < "public/$token")" = "$token"
          pnpm sitemap:check
          pnpm build
          test -f "dist/$token"
          test "$(tr -d '\r\n' < "dist/$token")" = "$token"
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links

      - name: Commit the validated permanent fix to main
        run: |
          set -euo pipefail
          git config user.name "IZEM Search Console Bootstrap"
          git config user.email "search-console-bootstrap@youraicoach.life"
          git add tools/check-links.mjs
          git diff --cached --quiet && { echo "::error::No validation fix was staged"; exit 1; }
          git commit -m "fix: exempt Google verification control files from page checks"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
