name: Deploy static content to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-gate:
    name: Check whether this commit is release-ready
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate incomplete newly-created blog posts
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "ready=true" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual deployment request: normal validation will decide readiness."
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          ADDED_POSTS=$(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" \
            | awk '$1 == "A" && $2 ~ /^public\/blog\/[^/]+\.html$/ && $2 != "public/blog/index.html" {print $2}')

          if [ -z "$ADDED_POSTS" ]; then
            exit 0
          fi

          node tools/ai-marketing/weekly-publish-guard.mjs

          blocked=0
          while IFS= read -r post; do
            [ -z "$post" ] && continue
            if ! grep -q '<!-- IZEM_VIDEO_START -->' "$post"; then
              echo "Deployment deferred: $post is waiting for its NotebookLM/YouTube release."
              blocked=1
            fi
            if ! grep -q 'data-owner-visual-policy="objects-only-v1"' "$post"; then
              echo "Deployment deferred: $post is waiting for deterministic object-only visuals."
              blocked=1
            fi
          done <<< "$ADDED_POSTS"

          if [ "$blocked" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment intentionally deferred"
              echo "A new article was pushed to main but its media release is not complete yet."
              echo "The Daily IZEM YouTube Video workflow will add deterministic object-only visuals, generate/validate/upload the NotebookLM video, attach it, and push a release-ready commit."
              echo "Nothing incomplete was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build, validate, deploy, and smoke-test
    needs: release-gate
    if: needs.release-gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Synchronize all generated discovery files
        run: |
          set -euo pipefail
          node tools/ai-marketing/rebuild-blog-index.mjs
          pnpm video:sync
          pnpm sitemap:sync

      - name: Validate source sitemap, video pages, structured data, and blog media
        run: |
          set -euo pipefail
          node tools/ai-marketing/weekly-publish-guard.mjs
          pnpm video:check
          pnpm sitemap:check
          node tools/validate-jsonld.mjs public
          node tools/ai-marketing/blog-media-policy.mjs --check-all

      - name: Build production artifact
        run: pnpm build

      - name: Verify every public blog page and required fallback exist
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r source; do
            target="dist/${source#public/}"
            if [ ! -f "$target" ]; then
              echo "::error::Missing built page: $target"
              missing=1
            fi
          done < <(find public/blog -type f -name '*.html' -print | sort)
          test "$missing" -eq 0
          test -f dist/404.html
          test -f dist/seo-system-version.json
          test -f dist/.well-known/apple-app-site-association
          test -f dist/.well-known/assetlinks.json

      - name: Block broken internal routes, invalid schema, and broken links
        run: |
          set -euo pipefail
          node tools/check-critical-routes.mjs dist
          node tools/validate-jsonld.mjs dist
          pnpm check:links

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test core pages and newest articles on the live domain
        run: |
          set -euo pipefail
          {
            echo "https://youraicoach.life/"
            echo "https://youraicoach.life/blog/"
            echo "https://youraicoach.life/seo-system-version.json"
            echo "https://youraicoach.life/.well-known/apple-app-site-association"
            echo "https://youraicoach.life/.well-known/assetlinks.json"
            node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('public/blog/feed.xml', 'utf8');
          for (const match of [...xml.matchAll(/<item>[\s\S]*?<link>([^<]+)<\/link>[\s\S]*?<\/item>/g)].slice(0, 5)) console.log(match[1].trim());
          NODE
          } | awk '!seen[$0]++' > /tmp/live-urls.txt

          success=0
          for attempt in $(seq 1 16); do
            success=1
            echo "Live smoke attempt ${attempt}/16"
            while IFS= read -r url; do
              body=$(mktemp)
              code=$(curl -L -sS --max-time 30 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "$url" || true)
              page_not_found=no
              grep -Eqi 'Page not found|<title>404|404 -' "$body" && page_not_found=yes
              echo "$url -> HTTP ${code:-curl-error}; page_not_found=$page_not_found"
              if [ "$code" != "200" ] || [ "$page_not_found" = "yes" ] || [ ! -s "$body" ]; then success=0; fi
              rm -f "$body"
            done < /tmp/live-urls.txt
            [ "$success" -eq 1 ] && break
            sleep 15
          done
          test "$success" -eq 1

      - name: Summarize verified deployment
        if: success()
        run: |
          {
            echo "### Verified GitHub Pages deployment"
            echo "- ✅ No incomplete new-article release was deployed"
            echo "- ✅ Discovery files synchronized"
            echo "- ✅ Source and built structured data valid"
            echo "- ✅ Strict object-only media policy validated"
            echo "- ✅ Internal critical routes and links valid"
            echo "- ✅ Pages artifact deployed"
            echo "- ✅ Core pages and newest articles returned HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
