name: Deploy static content to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-hosting
  cancel-in-progress: false

jobs:
  release-gate:
    name: Check whether this commit is release-ready
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate incomplete article releases
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "ready=true" >> "$GITHUB_OUTPUT"
          blocked=0

          # Any article that has entered the strict object-only pipeline is not
          # release-ready until the established IZEM video block is attached.
          while IFS= read -r post; do
            [ -z "$post" ] && continue
            if grep -q 'data-owner-visual-policy="objects-only-v1"' "$post" \
              && ! grep -q '<!-- IZEM_VIDEO_START -->' "$post"; then
              echo "Deployment deferred: $post is waiting for its validated NotebookLM/YouTube video."
              blocked=1
            fi
          done < <(find public/blog -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -print | sort)

          if [ "${{ github.event_name }}" = "push" ] \
            && [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ADDED_POSTS=$(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" \
              | awk '$1 == "A" && $2 ~ /^public\/blog\/[^/]+\.html$/ && $2 != "public/blog/index.html" {print $2}')
            if [ -n "$ADDED_POSTS" ]; then
              node tools/ai-marketing/weekly-publish-guard.mjs
              while IFS= read -r post; do
                [ -z "$post" ] && continue
                if ! grep -q '<!-- IZEM_VIDEO_START -->' "$post"; then
                  echo "Deployment deferred: newly-created $post has no final video block yet."
                  blocked=1
                fi
                if ! grep -q 'data-owner-visual-policy="objects-only-v1"' "$post"; then
                  echo "Deployment deferred: newly-created $post has no deterministic object-only visual policy marker yet."
                  blocked=1
                fi
              done <<< "$ADDED_POSTS"
            fi
          fi

          if [ "$blocked" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment intentionally deferred"
              echo "At least one new strict article is still inside the transactional media pipeline."
              echo "Nothing incomplete was deployed. The article becomes eligible only after object-only visuals and the validated NotebookLM/YouTube video are attached."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build, validate, deploy, and smoke-test
    needs: release-gate
    if: needs.release-gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Synchronize all generated discovery files
        run: |
          set -euo pipefail
          node tools/ai-marketing/rebuild-blog-index.mjs
          pnpm video:sync
          pnpm sitemap:sync

      - name: Validate source sitemap, video pages, structured data, and blog media
        run: |
          set -euo pipefail
          node tools/ai-marketing/weekly-publish-guard.mjs
          pnpm video:check
          pnpm sitemap:check
          node tools/validate-jsonld.mjs public
          node tools/ai-marketing/blog-media-policy.mjs --check-all

      - name: Build production artifact
        run: pnpm build

      - name: Verify every public blog page and required fallback exist
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r source; do
            target="dist/${source#public/}"
            if [ ! -f "$target" ]; then
              echo "::error::Missing built page: $target"
              missing=1
            fi
          done < <(find public/blog -type f -name '*.html' -print | sort)
          test "$missing" -eq 0
          test -f dist/404.html
          test -f dist/seo-system-version.json
          test -f dist/.well-known/apple-app-site-association
          test -f dist/.well-known/assetlinks.json

      - name: Block broken internal routes, invalid schema, and broken links
        run: |
          set -euo pipefail
          node tools/check-critical-routes.mjs dist
          node tools/validate-jsonld.mjs dist
          pnpm check:links

      - name: Configure Firebase service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          credential_json=''
          for name in GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_CLOUD_JSON GCP_SA_KEY GOOGLE_APPLICATION_CREDENTIALS_JSON; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              credential_json="$value"
              break
            fi
          done
          if [ -z "$credential_json" ]; then
            echo "::error::No Firebase/Google service-account JSON secret is configured for production deployment."
            exit 1
          fi
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$credential_json" > "$credential_file"
          chmod 600 "$credential_file"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$credential_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.29.0

      - name: Deploy production artifact to Firebase Hosting
        run: |
          set -euo pipefail
          project_id=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('.firebaserc','utf8')); process.stdout.write(cfg.projects.default || '')")
          test -n "$project_id"
          firebase deploy --only hosting --project "$project_id" --non-interactive

      - name: Smoke-test Firebase default host and production custom domain
        run: |
          set -euo pipefail
          project_id=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('.firebaserc','utf8')); process.stdout.write(cfg.projects.default || '')")
          test -n "$project_id"
          default_host="https://${project_id}.web.app"

          {
            echo "$default_host/"
            echo "$default_host/blog/"
            echo "$default_host/seo-system-version.json"
            echo "$default_host/blog/chatgpt-vs-fitness-app-workouts"
            echo "https://youraicoach.life/"
            echo "https://youraicoach.life/blog/"
            echo "https://youraicoach.life/seo-system-version.json"
            echo "https://youraicoach.life/.well-known/apple-app-site-association"
            echo "https://youraicoach.life/.well-known/assetlinks.json"
            node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('public/blog/feed.xml', 'utf8');
          for (const match of [...xml.matchAll(/<item>[\s\S]*?<link>([^<]+)<\/link>[\s\S]*?<\/item>/g)].slice(0, 5)) console.log(match[1].trim());
          NODE
          } | awk '!seen[$0]++' > /tmp/live-urls.txt

          success=0
          for attempt in $(seq 1 12); do
            success=1
            echo "Live smoke attempt ${attempt}/12"
            while IFS= read -r url; do
              body=$(mktemp)
              code=$(curl -L -sS --max-time 30 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "$url" || true)
              page_not_found=no
              grep -Eqi 'Page not found|<title>404|404 -' "$body" && page_not_found=yes
              echo "$url -> HTTP ${code:-curl-error}; page_not_found=$page_not_found"
              if [ "$code" != "200" ] || [ "$page_not_found" = "yes" ] || [ ! -s "$body" ]; then success=0; fi
              rm -f "$body"
            done < /tmp/live-urls.txt
            [ "$success" -eq 1 ] && break
            sleep 10
          done
          test "$success" -eq 1

      - name: Summarize verified deployment
        if: success()
        run: |
          {
            echo "### Verified Firebase Hosting deployment"
            echo "- ✅ No incomplete new-article release was deployed"
            echo "- ✅ Discovery files synchronized"
            echo "- ✅ Source and built structured data valid"
            echo "- ✅ Strict object-only media policy validated"
            echo "- ✅ Internal critical routes and links valid"
            echo "- ✅ Firebase Hosting production artifact deployed"
            echo "- ✅ Firebase default host and custom-domain core/article URLs returned HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
