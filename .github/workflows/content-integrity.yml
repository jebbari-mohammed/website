name: Content integrity

on:
  push:
    branches: [main, master]
    paths:
      - 'public/**/*.html'
      - 'public/blog/assets/**'
      - 'data/brand/product-facts.json'
      - 'data/marketing-employee/narrations/**'
      - 'tools/validate-jsonld.mjs'
      - 'tools/ai-marketing/blog-media-policy.mjs'
      - 'tools/ai-marketing/generate-object-blog-visuals.mjs'
      - 'tools/ai-marketing/weekly-publish-guard.mjs'
      - 'tools/ai-marketing/video-human-safety.mjs'
      - 'tools/ai-marketing/product-facts-contract.mjs'
      - 'tools/ai-marketing/daily-notebooklm-video*.mjs'
      - 'tools/ai-marketing/notebooklm-*.mjs'
      - 'tools/ai-marketing/article-video-*.mjs'
      - 'tools/ai-marketing/youtube-publication*.mjs'
      - 'tools/ai-marketing/object-only-video*.mjs'
      - 'tools/ai-marketing/.notebooklm-video-progress.json'
      - '.github/workflows/daily-video-tts.yml'
      - '.github/workflows/content-integrity.yml'
  pull_request:
    paths:
      - 'public/**/*.html'
      - 'public/blog/assets/**'
      - 'data/brand/product-facts.json'
      - 'data/marketing-employee/narrations/**'
      - 'tools/validate-jsonld.mjs'
      - 'tools/ai-marketing/blog-media-policy.mjs'
      - 'tools/ai-marketing/generate-object-blog-visuals.mjs'
      - 'tools/ai-marketing/weekly-publish-guard.mjs'
      - 'tools/ai-marketing/video-human-safety.mjs'
      - 'tools/ai-marketing/product-facts-contract.mjs'
      - 'tools/ai-marketing/daily-notebooklm-video*.mjs'
      - 'tools/ai-marketing/notebooklm-*.mjs'
      - 'tools/ai-marketing/article-video-*.mjs'
      - 'tools/ai-marketing/youtube-publication*.mjs'
      - 'tools/ai-marketing/object-only-video*.mjs'
      - 'tools/ai-marketing/.notebooklm-video-progress.json'
      - '.github/workflows/daily-video-tts.yml'
      - '.github/workflows/content-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "content-integrity-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Syntax-check SEO safety automation
        run: |
          set -euo pipefail
          node --check tools/ai-marketing/blog-media-policy.mjs
          node --check tools/ai-marketing/generate-object-blog-visuals.mjs
          node --check tools/ai-marketing/weekly-publish-guard.mjs
          node --check tools/ai-marketing/video-human-safety.mjs
          node --check tools/ai-marketing/product-facts-contract.mjs
          node --check tools/ai-marketing/daily-notebooklm-video.mjs
          node --check tools/ai-marketing/daily-notebooklm-video-v2.mjs
          node --check tools/ai-marketing/notebooklm-recovery-diagnostic.mjs
          node --check tools/ai-marketing/notebooklm-retry-failed-artifact.mjs
          node --check tools/ai-marketing/article-video-contract.mjs
          node --check tools/ai-marketing/article-video-fallback.mjs
          node --check tools/ai-marketing/youtube-publication.mjs
          node --check tools/ai-marketing/object-only-video.mjs

      - name: Test safe NotebookLM diagnostics and bounded retries
        run: node --test tools/ai-marketing/notebooklm-*.test.mjs

      - name: Test independently narrated recovery and spending checkpoints
        run: node --test tools/ai-marketing/article-video-fallback.test.mjs

      - name: Test actual YouTube publication requirements
        run: node --test tools/ai-marketing/youtube-publication*.test.mjs

      - name: Test deterministic video with actual encoding and audio
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          node --test tools/ai-marketing/object-only-video*.test.mjs

      - name: Check a new article has a slot before merging
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          COUNT=$(git diff --name-status --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- 'public/blog/*.html' | awk '$2 ~ /^public\/blog\/[^/]+\.html$/ && $2 != "public/blog/index.html" {n++} END {print n+0}')
          if [ "$COUNT" -gt 1 ]; then echo 'Only one new English article is permitted per release.'; exit 1; fi
          if [ "$COUNT" -eq 1 ]; then
            CHECK_DIR="$RUNNER_TEMP/izem-blog-slot"
            git worktree add --detach "$CHECK_DIR" "$BASE_SHA"
            (cd "$CHECK_DIR" && node tools/ai-marketing/weekly-publish-guard.mjs --require-slot)
            git worktree remove "$CHECK_DIR"
          fi

      - name: Enforce weekly creation ceiling
        run: node tools/ai-marketing/weekly-publish-guard.mjs

      - name: Validate canonical product-facts contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/brand/product-facts.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (value?.brand !== 'IZEM') throw new Error('product-facts.json brand must be IZEM');
          if (!Array.isArray(value?.verifiedFacts) || value.verifiedFacts.length < 3) throw new Error('product-facts.json requires verifiedFacts');
          if (value?.visualPolicy?.humansAllowed !== false) throw new Error('product-facts.json must explicitly forbid humans');
          if (!value?.contentRules?.pricing?.includes('Never state an exact price')) throw new Error('pricing verification policy is missing');
          console.log('Canonical product-facts JSON shape passed.');
          NODE
          node tools/ai-marketing/product-facts-contract.mjs

      - name: Validate structured data in every public HTML page
        run: node tools/validate-jsonld.mjs public

      - name: Enforce object-only media on marked blog articles
        run: node tools/ai-marketing/blog-media-policy.mjs --check-all

      - name: Enforce dedicated videos before release
        # Media is generated after the approved article reaches main, before deployment.
        if: github.event_name != 'pull_request'
        run: node tools/ai-marketing/article-video-contract.mjs --check-all
