name: Content integrity

on:
  push:
    branches: [main, master]
    paths:
      - 'public/**/*.html'
      - 'tools/validate-jsonld.mjs'
      - '.github/workflows/content-integrity.yml'
  pull_request:
    paths:
      - 'public/**/*.html'
      - 'tools/validate-jsonld.mjs'
      - '.github/workflows/content-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "content-integrity-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  surface-search-console-action:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/gsc-action-surface' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Checkout action branch
        uses: actions/checkout@v7
        with:
          ref: agent/gsc-action-surface
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Inspect Search Console ownership or request Google's FILE token
        id: prepare
        run: node tools/ai-marketing/gsc-url-prefix-bootstrap.mjs prepare

      - name: Materialize the exact pending action or verification token
        run: |
          set -euo pipefail
          status="${{ steps.prepare.outputs.status }}"
          if [ "$status" = "api-disabled" ]; then
            enable_url="${{ steps.prepare.outputs.enable_url }}"
            cat > .github/SEO_GOOGLE_ACTION.md <<EOF
# One-time Google authorization required

Everything controlled by the repository is validated and the SEO production system is fail-closed. Google Site Verification is disabled in the existing service-account project.

## Complete this one Google-owned step

[Enable the Google Site Verification API](${enable_url})

Sign into the Google account that owns that project and click **Enable**. Do not paste any key into GitHub or chat.

After it is enabled, the scheduled Search Console bootstrap automatically requests Google's FILE token, deploys it, verifies `https://youraicoach.life/`, adds the Search Console URL-prefix property, proves private query+page access, activates daily GSC-backed SEO, and removes this file.
EOF
          elif [ "$status" = "file-ready" ]; then
            file="public/${{ steps.prepare.outputs.verification_file }}"
            test -f "$file"
            test "$(tr -d '\r\n' < "$file")" = "${{ steps.prepare.outputs.verification_file }}"
            rm -f .github/SEO_GOOGLE_ACTION.md
          elif [ "$status" = "already-verified" ]; then
            rm -f .github/SEO_GOOGLE_ACTION.md
          else
            echo "::error::Unexpected bootstrap status: $status"
            exit 1
          fi

      - name: Restore normal integrity workflow and commit the observable state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/content-integrity.yml
          git rm -f .github/workflows/surface-gsc-action.yml 2>/dev/null || true
          git config user.name "IZEM Search Console Bootstrap"
          git config user.email "search-console-bootstrap@youraicoach.life"
          git add -A .github public/google*.html 2>/dev/null || true
          git diff --cached --quiet && { echo "::error::Bootstrap state produced no reviewable change"; exit 1; }
          git commit -m "chore: surface Search Console bootstrap action"
          git push origin HEAD:agent/gsc-action-surface

  validate:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'agent/gsc-action-surface') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate structured data in every public HTML page
        run: node tools/validate-jsonld.mjs public
