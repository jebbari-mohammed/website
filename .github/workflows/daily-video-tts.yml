name: Daily NotebookLM YouTube Video

on:
  # Runs every day after the morning blog/content job.
  schedule:
    - cron: '30 10 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Optional blog slug to process, for example ai-coach-better-than-human-personal-trainer"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-notebooklm-video:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0-120 min) for natural timing
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "Waiting ${DELAY} seconds before generating..."
          sleep $DELAY

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NotebookLM CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "notebooklm-py"

      - name: Generate NotebookLM video, publish to YouTube, and embed on site
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_HOME: ${{ runner.temp }}/notebooklm
          NOTEBOOKLM_PROFILE: github-actions
          NOTEBOOKLM_POST_SLUG: ${{ github.event.inputs.post_slug }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node tools/ai-marketing/daily-notebooklm-video.mjs

      - name: Commit and push website video embed
        run: |
          git config user.name "AI Marketing Bot"
          git config user.email "bot@youraicoach.life"
          git add public tools/ai-marketing/.notebooklm-video-progress.json
          if git diff --staged --quiet; then
            echo "No NotebookLM video website changes to commit."
            exit 0
          fi
          git commit -m "Auto-publish NotebookLM video $(date +%Y-%m-%d)"
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)
