name: Daily IZEM YouTube Video

on:
  push:
    branches: [main]
    paths:
      - 'public/blog/*.html'
      - '!public/blog/index.html'
      - 'data/marketing-employee/video-repair-request.json'
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Blog slug to process, for example workout-app-for-nurses-12-hour-shifts"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: izem-video-publisher
  cancel-in-progress: false

jobs:
  generate-izem-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Resolve the article that needs video processing
        id: detect-post
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ADDED_POSTS=$(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" \
            | awk '$1 == "A" && $2 ~ /^public\/blog\/[^/]+\.html$/ && $2 != "public/blog/index.html" {print $2}')
          NEW_COUNT=$(printf '%s\n' "$ADDED_POSTS" | sed '/^$/d' | wc -l | tr -d ' ')
          REPAIR_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- data/marketing-employee/video-repair-request.json | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$NEW_COUNT" -gt 1 ]; then
            echo "::error::Expected at most one new top-level English blog post per push, found $NEW_COUNT"
            exit 1
          fi
          if [ "$NEW_COUNT" -eq 1 ] && [ "$REPAIR_CHANGED" -gt 0 ]; then
            echo "::error::A new article and a video-repair request changed in the same push. Split them into separate releases."
            exit 1
          fi

          if [ "$NEW_COUNT" -eq 1 ]; then
            POST_FILE=$(printf '%s\n' "$ADDED_POSTS" | sed -n '1p')
            POST_SLUG=$(basename "$POST_FILE" .html)
            echo "Detected new blog post: $POST_SLUG"
            echo "slug=$POST_SLUG" >> "$GITHUB_OUTPUT"
            echo "mode=new" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REPAIR_CHANGED" -gt 0 ]; then
            POST_SLUG=$(node - <<'NODE'
          const fs = require('fs');
          const file = 'data/marketing-employee/video-repair-request.json';
          if (!fs.existsSync(file)) process.exit(2);
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slug = String(value.slug || '');
          if (!/^[a-z0-9][a-z0-9-]{1,119}$/.test(slug)) throw new Error('video repair request contains an invalid slug');
          if (!fs.existsSync(`public/blog/${slug}.html`)) throw new Error(`video repair target does not exist: ${slug}`);
          process.stdout.write(slug);
          NODE
            )
            echo "Detected explicit video repair request: $POST_SLUG"
            echo "slug=$POST_SLUG" >> "$GITHUB_OUTPUT"
            echo "mode=repair" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "slug=" >> "$GITHUB_OUTPUT"

      - name: Stop cleanly when a push needs no video work
        if: github.event_name == 'push' && steps.detect-post.outputs.slug == ''
        run: echo "No new article or explicit video-repair request; video generation is not required."

      - name: Set up pnpm
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install "notebooklm-py"
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Enforce the global weekly new-post ceiling
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        run: node tools/ai-marketing/weekly-publish-guard.mjs

      - name: Ensure deterministic object-only article visuals
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        env:
          POST_SLUG: ${{ github.event_name == 'push' && steps.detect-post.outputs.slug || github.event.inputs.post_slug }}
        run: |
          set -euo pipefail
          node tools/ai-marketing/generate-object-blog-visuals.mjs --slug "$POST_SLUG"
          node tools/ai-marketing/blog-media-policy.mjs --file "public/blog/${POST_SLUG}.html"

      - name: Generate, visually validate, publish, and attach the video
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_HOME: ${{ runner.temp }}/notebooklm
          NOTEBOOKLM_PROFILE: github-actions
          NOTEBOOKLM_POST_SLUG: ${{ github.event_name == 'push' && steps.detect-post.outputs.slug || github.event.inputs.post_slug }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          VIDEO_SAFETY_GEMINI_MODEL: gemini-3.5-flash
        run: node tools/ai-marketing/daily-notebooklm-video.mjs

      - name: Build dedicated video pages and refresh discovery files
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        run: |
          set -euo pipefail
          node tools/sync-video-pages.mjs
          node tools/sync-sitemap.mjs

      - name: Re-check final article media policy
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        env:
          POST_SLUG: ${{ github.event_name == 'push' && steps.detect-post.outputs.slug || github.event.inputs.post_slug }}
        run: node tools/ai-marketing/blog-media-policy.mjs --file "public/blog/${POST_SLUG}.html"

      - name: Validate final structured data and video artifacts
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        run: |
          set -euo pipefail
          node tools/validate-jsonld.mjs public
          node tools/sync-video-pages.mjs --check
          node tools/sync-sitemap.mjs --check

      - name: Commit the completed article release atomically
        id: commit
        if: github.event_name != 'push' || steps.detect-post.outputs.slug != ''
        run: |
          set -euo pipefail
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add public tools/ai-marketing/.notebooklm-video-progress.json
          if git diff --staged --quiet; then
            echo "No completed video/article changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "seo: complete article video release $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          pushed_sha=$(git rev-parse HEAD)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$pushed_sha" >> "$GITHUB_OUTPUT"
          echo "Completed media release pushed: $pushed_sha"

      - name: Deploy the completed media release to Pages
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.pushed_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_SHA: ${{ steps.commit.outputs.pushed_sha }}
        run: |
          set -euo pipefail

          # Pushes authored with GITHUB_TOKEN do not recursively start the push-based
          # Pages workflow. Dispatch deployment explicitly and bind verification to
          # the exact completed media-release commit.
          gh workflow run deploy.yml --ref main

          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --workflow deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 15 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${PUSHED_SHA}\") | .databaseId" \
              | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            echo "Waiting for Pages deployment run for ${PUSHED_SHA} (${attempt}/30)..."
            sleep 3
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched Pages deployment for ${PUSHED_SHA}."
            exit 1
          fi

          echo "Waiting for Pages deployment run ${run_id} for ${PUSHED_SHA}."
          gh run watch "$run_id" --exit-status

      - name: Summarize completed media release
        if: success() && (github.event_name != 'push' || steps.detect-post.outputs.slug != '')
        run: |
          {
            echo "### IZEM article media release"
            echo "- Mode: ${{ steps.detect-post.outputs.mode || 'manual' }}"
            echo "- ✅ Weekly publishing ceiling checked"
            echo "- ✅ Deterministic object-only article visuals validated"
            echo "- ✅ NotebookLM video generated or a previously validated matching video reused"
            echo "- ✅ New uploads passed uniform full-duration zero-human frame validation"
            echo "- ✅ YouTube video attached through the established /youtube/<id>/ method"
            echo "- ✅ Video pages, sitemap, and structured data validated"
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- ✅ Completed article release pushed to main and exact commit deployed to Pages"
            else
              echo "- ✅ No repository delta remained; no deployment handoff was required"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
