name: Legacy SEO quarantine

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-marketing/legacy-content-audit.mjs'
      - 'tools/sync-news-sitemap.mjs'
      - '.github/workflows/legacy-seo-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-seo-quarantine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quarantine:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'agent/legacy-seo-cleanup' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and quarantine clearly misleading legacy pages
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --apply --report /tmp/legacy-seo-before.json
          node tools/ai-marketing/rebuild-blog-index.mjs
          pnpm sitemap:sync
          node tools/sync-news-sitemap.mjs

      - name: Prove no high-risk legacy page remains indexable
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --strict --report /tmp/legacy-seo-after.json
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/legacy-seo-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/legacy-seo-after.json', 'utf8'));
          console.log(`Scanned ${after.filesScanned} HTML files.`);
          console.log(`Quarantined ${before.changed} high-risk files.`);
          console.log(`High-risk indexable pages after cleanup: ${after.highRiskIndexable}.`);
          if (after.highRiskIndexable !== 0) process.exit(1);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Legacy SEO quarantine\n- HTML files scanned: ${after.filesScanned}\n- Files quarantined: ${before.changed}\n- High-risk indexable pages remaining: ${after.highRiskIndexable}\n- Total non-blocking warnings: ${after.findings.length}\n`);
          }
          NODE

      - name: Validate source and production output
        run: |
          set -euo pipefail
          node tools/validate-jsonld.mjs public
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

      - name: Commit quarantined pages and remove this one-time workflow
        run: |
          set -euo pipefail
          branch="${{ github.event_name == 'pull_request' && github.head_ref || 'agent/legacy-seo-cleanup' }}"
          git config user.name "IZEM Editorial Cleanup"
          git config user.email "editorial-cleanup@youraicoach.life"
          git rm .github/workflows/legacy-seo-quarantine.yml
          git add public tools/ai-marketing/legacy-content-audit.mjs tools/sync-news-sitemap.mjs
          if git diff --cached --quiet; then
            echo "::error::Legacy audit produced no reviewable changes"
            exit 1
          fi
          git commit -m "seo: quarantine misleading legacy content"
          git push origin HEAD:"$branch"
