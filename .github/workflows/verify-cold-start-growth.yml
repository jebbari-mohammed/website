name: Verify cold-start SEO growth

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-marketing/cold-start-growth.mjs'
      - 'tools/ai-marketing/cold-start-growth.test.mjs'
      - '.github/workflows/daily-cold-start-growth.yml'
      - '.github/workflows/verify-cold-start-growth.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-cold-start-seo-growth
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout cold-start branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'agent/always-improve-seo' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cold-start unit and idempotency tests
        run: pnpm test:cold-start

      - name: Apply the first real deterministic growth action to the branch
        id: growth
        run: pnpm seo:cold-start

      - name: Require a real, bounded improvement
        run: |
          set -euo pipefail
          [ "${{ steps.growth.outputs.changed }}" = "true" ]
          [ "${{ steps.growth.outputs.action }}" = "internal-links" ]
          [ -n "${{ steps.growth.outputs.target_url }}" ]
          [ -n "${{ steps.growth.outputs.files }}" ]
          IFS=',' read -ra files <<< "${{ steps.growth.outputs.files }}"
          [ "${#files[@]}" -ge 1 ]
          [ "${#files[@]}" -le 2 ]
          for file in "${files[@]}"; do
            [[ "$file" =~ ^public/.+\.html$ ]]
            grep -q "${{ steps.growth.outputs.marker }}" "$file"
          done

      - name: Prove a second dry selection cannot duplicate the same target links
        run: |
          set -euo pipefail
          node tools/ai-marketing/cold-start-growth.mjs --dry-run > /tmp/second-selection.log
          if grep -q "Target: ${{ steps.growth.outputs.target_url }}" /tmp/second-selection.log; then
            echo "::error::The completed target was immediately selected again"
            cat /tmp/second-selection.log
            exit 1
          fi

      - name: Validate the complete changed website
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --strict
          node tools/validate-jsonld.mjs public
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links

      - name: Commit the verified first action and remove this one-time verifier
        run: |
          set -euo pipefail
          branch="${{ github.event_name == 'pull_request' && github.head_ref || 'agent/always-improve-seo' }}"
          git config user.name "IZEM Cold-Start SEO"
          git config user.email "cold-start-seo@youraicoach.life"
          git rm .github/workflows/verify-cold-start-growth.yml
          IFS=',' read -ra files <<< "${{ steps.growth.outputs.files }}"
          for file in "${files[@]}"; do git add "$file"; done
          git commit -m "seo: apply first cold-start internal-link action"
          git push origin HEAD:"$branch"
