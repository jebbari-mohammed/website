name: Branch website quality check

on:
  push:
    branches:
      - fix/deep-website-audit-2026-09-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize generated pages
        run: |
          pnpm video:sync
          pnpm sitemap:sync

      - name: Build production artifact
        run: pnpm build

      - name: Verify generated files and links
        run: |
          pnpm video:check
          pnpm sitemap:check
          pnpm check:links

      - name: Verify deep-audit remediations
        run: |
          set -euo pipefail
          ! grep -RFiq 'daily voice call accountability.' dist
          ! grep -RFiq 'We consolidated this comparison' dist/best-ai-fitness-app.html
          test "$(grep -RFl 'data-izem-publisher="true"' dist/index.html dist/blog/index.html 2>/dev/null | wc -l)" -eq 0
          test "$(grep -o 'class="izem-video-card"[^>]*aria-label=' dist/youtube/index.html | wc -l)" -eq 0
          grep -Fq 'hero1-desktop.webp' dist/index.html
          grep -Fq 'public, max-age=60, must-revalidate' firebase.json
