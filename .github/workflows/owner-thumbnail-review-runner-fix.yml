name: Patch owner thumbnail visual-review runner

on:
  push:
    branches:
      - seo/owner-video-thumbnails-2026-09-14

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'runner Chrome fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: seo/owner-video-thumbnails-2026-09-14
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use runner Chrome for visual verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/owner-image-thumbnail-migration.yml')
          text = path.read_text()
          old = "const browser = await puppeteer.launch({headless:true,args:['--no-sandbox']})"
          new = """const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
          const executablePath = candidates.find((candidate) => fs.existsSync(candidate))
          if (!executablePath) throw new Error(`No system Chrome found in ${candidates.join(', ')}`)
          const browser = await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox']})"""
          if old not in text:
              raise SystemExit('Puppeteer launch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/owner-thumbnail-review-runner-fix.yml
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add .github/workflows/owner-image-thumbnail-migration.yml
          git commit -m "chore: use runner Chrome for owner thumbnail review"
          git push origin HEAD:seo/owner-video-thumbnails-2026-09-14
