name: SEO hardening bootstrap

on:
  push:
    branches: [agent/seo-production-hardening]
    paths:
      - '.github/workflows/seo-hardening-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-hardening-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the hardening branch
        uses: actions/checkout@v7
        with:
          ref: agent/seo-production-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate the production lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Replace broad schema regex edits with typed JSON-LD mutation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/ai-marketing/seo-publisher-core.mjs';
          let source = fs.readFileSync(file, 'utf8');

          if (source.includes('function syncStructuredData(')) {
            console.log('Typed JSON-LD synchronization is already installed.');
            process.exit(0);
          }

          const start = source.indexOf('function jsonStringContent');
          const end = source.indexOf('export function setSocialImage', start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('Could not locate the metadata synchronization block safely');
          }

          const replacement = `function schemaTypes(value) {
            const raw = value?.['@type'];
            return new Set((Array.isArray(raw) ? raw : [raw]).filter(Boolean).map(String));
          }

          function updateSchemaMetadata(value, metadata) {
            if (Array.isArray(value)) {
              return value.reduce((changed, item) => updateSchemaMetadata(item, metadata) || changed, false);
            }
            if (!value || typeof value !== 'object') return false;

            let changed = false;
            const types = schemaTypes(value);
            const article = ['Article', 'BlogPosting', 'NewsArticle'].some((type) => types.has(type));
            const page = ['WebPage', 'CollectionPage', 'AboutPage'].some((type) => types.has(type));

            if (article) {
              value.headline = metadata.title;
              value.description = metadata.description;
              if (metadata.dateModified) value.dateModified = metadata.dateModified;
              changed = true;
            } else if (page) {
              if ('name' in value) value.name = metadata.title;
              value.description = metadata.description;
              if (metadata.dateModified) value.dateModified = metadata.dateModified;
              changed = true;
            }

            for (const nested of Object.values(value)) {
              if (nested && typeof nested === 'object') {
                changed = updateSchemaMetadata(nested, metadata) || changed;
              }
            }
            return changed;
          }

          function syncStructuredData(html, metadata) {
            return html.replace(/<script\\b([^>]*\\btype\\s*=\\s*(["'])application\\/ld\\+json\\2[^>]*)>([\\s\\S]*?)<\\/script>/gi, (match, attributes, _quote, body) => {
              try {
                const data = JSON.parse(body);
                if (!updateSchemaMetadata(data, metadata)) return match;
                const serialized = JSON.stringify(data, null, 2).replace(/</g, '\\\\u003c');
                return \`<script\${attributes}>\\n\${serialized}\\n</script>\`;
              } catch {
                return match;
              }
            });
          }

          export function syncArticleMetadata(html, { title, description, dateModified }) {
            let output = setTitle(html, title);
            output = setMetaTag(output, 'name', 'description', description);
            output = setMetaTag(output, 'property', 'og:title', title);
            output = setMetaTag(output, 'property', 'og:description', description);
            output = setMetaTag(output, 'name', 'twitter:title', title);
            output = setMetaTag(output, 'name', 'twitter:description', description);
            return syncStructuredData(output, { title, description, dateModified });
          }

          `;

          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(file, source);
          console.log('Typed JSON-LD synchronization installed.');
          NODE

      - name: Run the complete deterministic verification suite
        run: |
          set -euo pipefail
          pnpm test:seo-growth
          node tools/validate-jsonld.mjs public
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links

      - name: Commit reproducible dependencies and remove this one-time bootstrap
        run: |
          set -euo pipefail
          git config user.name "IZEM SEO Hardening"
          git config user.email "seo-hardening@youraicoach.life"
          git rm .github/workflows/seo-hardening-bootstrap.yml
          git add pnpm-lock.yaml tools/ai-marketing/seo-publisher-core.mjs
          git commit -m "chore: finalize reproducible SEO hardening"
          git push origin HEAD:agent/seo-production-hardening
