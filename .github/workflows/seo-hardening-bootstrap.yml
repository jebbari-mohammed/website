name: SEO hardening bootstrap

on:
  push:
    branches: [agent/seo-production-hardening]
    paths:
      - '.github/workflows/seo-hardening-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-hardening-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the hardening branch
        uses: actions/checkout@v7
        with:
          ref: agent/seo-production-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate the production lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Require live search grounding and expose a verifiable output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/ai-marketing/seo-production.mjs';
          let source = fs.readFileSync(file, 'utf8');

          const oldOutputs = "for (const [name, value] of Object.entries({ changed: 'false', action: 'none', slug: '', url: '', marker: '', query_hash: '', validated: 'false' })) setOutput(name, value);";
          const newOutputs = "for (const [name, value] of Object.entries({ changed: 'false', action: 'none', slug: '', url: '', marker: '', query_hash: '', validated: 'false', grounded: 'false' })) setOutput(name, value);";
          if (source.includes(oldOutputs)) source = source.replace(oldOutputs, newOutputs);
          else if (!source.includes(newOutputs)) throw new Error('Could not patch SEO output initialization safely');

          const oldResearch = "console.log(`SERP research phase: ${research.grounded ? 'grounded' : 'conservative fallback'}.`);\n  const drafted = await createDeliverable(item, research, currentPageExcerpt(targetFile));";
          const newResearch = "console.log(`SERP research phase: ${research.grounded ? 'grounded' : 'unavailable'}.`);\n  setOutput('grounded', research.grounded ? 'true' : 'false');\n  if (!research.grounded) {\n    throw new Error('Live Google Search grounding was unavailable; publication is skipped rather than using an ungrounded fallback');\n  }\n  const drafted = await createDeliverable(item, research, currentPageExcerpt(targetFile));";
          if (source.includes(oldResearch)) source = source.replace(oldResearch, newResearch);
          else if (!source.includes("setOutput('grounded', research.grounded ? 'true' : 'false')")) throw new Error('Could not patch grounded-research gate safely');

          fs.writeFileSync(file, source);
          console.log('Grounded-research fail-closed gate installed.');
          NODE

      - name: Run the complete deterministic verification suite
        run: |
          set -euo pipefail
          pnpm test:seo-growth
          node tools/validate-jsonld.mjs public
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links

      - name: Commit reproducible dependencies and remove this one-time bootstrap
        run: |
          set -euo pipefail
          git config user.name "IZEM SEO Hardening"
          git config user.email "seo-hardening@youraicoach.life"
          git rm .github/workflows/seo-hardening-bootstrap.yml
          git add pnpm-lock.yaml tools/ai-marketing/seo-production.mjs
          git commit -m "chore: finalize reproducible SEO hardening"
          git push origin HEAD:agent/seo-production-hardening
