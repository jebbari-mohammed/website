name: Verify first cold-start improvement live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-first-cold-start-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-first-cold-start-improvement
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require the exact internal-link marker on both live source pages
        run: |
          set -euo pipefail
          node tools/ai-marketing/verify-live-seo.mjs \
            --url "https://youraicoach.life/izem-ai-fitness-coach/" \
            --marker "SEO_ALWAYS_IMPROVE_LINK:915d3d665dee"
          node tools/ai-marketing/verify-live-seo.mjs \
            --url "https://youraicoach.life/ai-fitness-coach" \
            --marker "SEO_ALWAYS_IMPROVE_LINK:915d3d665dee"

      - name: Remove this one-time verifier after success
        run: |
          set -euo pipefail
          git config user.name "IZEM Cold-Start SEO"
          git config user.email "cold-start-seo@youraicoach.life"
          git rm .github/workflows/verify-first-cold-start-live.yml
          git commit -m "chore: confirm first cold-start improvement live"
          git push origin HEAD:main
