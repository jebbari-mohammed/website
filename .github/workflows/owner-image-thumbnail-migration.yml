name: Owner-safe video thumbnail migration

on:
  push:
    branches:
      - seo/owner-video-thumbnails-2026-09-14

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[owner-thumbnail-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: seo/owner-video-thumbnails-2026-09-14
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migration and regenerate video surfaces
        run: |
          set -euo pipefail
          node tools/apply-owner-video-thumbnail-migration.mjs
          pnpm video:sync

      - name: Validate policy and generated video state
        run: |
          set -euo pipefail
          pnpm check:owner-images
          pnpm video:check
          node tools/validate-jsonld.mjs public
          pnpm sitemap:check
          pnpm test:seo-growth
          pnpm build
          pnpm check:links

      - name: Create visual review contact sheet
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import puppeteer from 'puppeteer'

          const catalog = JSON.parse(fs.readFileSync('public/youtube/video-catalog.json', 'utf8'))
          const cards = catalog.videos.map((video) => {
            const svg = fs.readFileSync(path.join('public', 'youtube', video.id, 'thumbnail.svg'))
            const data = `data:image/svg+xml;base64,${svg.toString('base64')}`
            return `<figure><img src="${data}" alt=""><figcaption>${video.id}</figcaption></figure>`
          }).join('')
          const html = `<!doctype html><meta charset="utf-8"><style>body{margin:20px;background:#111;color:#fff;font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0;background:#222;padding:6px;border-radius:8px}img{display:block;width:100%;aspect-ratio:16/9}figcaption{padding:4px 2px 0;color:#ccc}</style><div class="grid">${cards}</div>`
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
          const executablePath = process.env.PUPPETEER_EXECUTABLE_PATH || candidates.find((candidate) => fs.existsSync(candidate))
          if (!executablePath) throw new Error(`No system Chrome found in ${candidates.join(', ')}`)
          const browser = await puppeteer.launch({headless:'new',executablePath,args:['--no-sandbox','--disable-setuid-sandbox']})
          const page = await browser.newPage()
          await page.setViewport({width:1600,height:1200,deviceScaleFactor:1})
          await page.setContent(html, {waitUntil:'load'})
          await page.screenshot({path:'owner-thumbnail-review.png', fullPage:true})
          await browser.close()
          NODE

      - name: Upload visual review contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: owner-thumbnail-visual-review
          path: owner-thumbnail-review.png
          retention-days: 7

      - name: Ensure remote YouTube thumbnails are gone
        run: |
          set -euo pipefail
          if grep -RInE 'https?://(i\.ytimg\.com|img\.youtube\.com)/' public --include='*.html' --include='*.xml' --include='*.json' --include='*.svg'; then
            echo '::error::Unverified remote YouTube thumbnail reference remains in public output.'
            exit 1
          fi

      - name: Commit completed migration
        run: |
          set -euo pipefail
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git rm tools/apply-owner-video-thumbnail-migration.mjs
          git add -A
          git reset owner-thumbnail-review.png
          git commit -m "fix(images): own all video thumbnails [owner-thumbnail-migration]"
          git push origin HEAD:seo/owner-video-thumbnails-2026-09-14
