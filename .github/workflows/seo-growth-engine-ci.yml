name: SEO evidence and site validation

on:
  pull_request:
    paths:
      - 'config/seo-growth.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/ai-marketing/**'
      - '.github/workflows/daily-blog.yml'
      - '.github/workflows/daily-cold-start-growth.yml'
      - '.github/workflows/search-console-bootstrap.yml'
      - '.github/workflows/seo-growth-engine-ci.yml'
      - 'public/seo-system-version.json'
  push:
    branches: [main]
    paths:
      - 'config/seo-growth.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/ai-marketing/**'
      - '.github/workflows/daily-blog.yml'
      - '.github/workflows/daily-cold-start-growth.yml'
      - '.github/workflows/search-console-bootstrap.yml'
      - '.github/workflows/seo-growth-engine-ci.yml'
      - 'public/seo-system-version.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SEO and evidence script syntax
        run: |
          set -euo pipefail
          node --check tools/ai-marketing/gsc-fetch-private.mjs
          node --check tools/ai-marketing/gsc-url-prefix-bootstrap.mjs
          node --check tools/ai-marketing/seo-growth-engine.mjs
          node --check tools/ai-marketing/seo-expert-plan.mjs
          node --check tools/ai-marketing/seo-publisher-core.mjs
          node --check tools/ai-marketing/seo-production.mjs
          node --check tools/ai-marketing/seo-production-runner.mjs
          node --check tools/ai-marketing/seo-og-card.mjs
          node --check tools/ai-marketing/verify-live-seo.mjs
          node --check tools/ai-marketing/cold-start-growth.mjs

      - name: Test planner, clustering, sanitizer, metadata, idempotency, and safety policy
        run: |
          set -euo pipefail
          pnpm test:seo-growth
          pnpm test:cold-start

      - name: Validate current public structured data
        run: node tools/validate-jsonld.mjs public

      - name: Validate crawl and indexability guardrails
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --strict
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

      - name: Build production site
        run: pnpm build

      - name: Validate critical production routes, structured data, and links
        run: |
          set -euo pipefail
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

  lockfile:
    name: Verify reproducible dependency resolution
    needs: deterministic
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the committed lockfile
        run: pnpm install --frozen-lockfile
