name: Daily Blog Post

on:
  # One of these hourly checks publishes at a daily pseudo-random time between
  # 10:00 and 17:00 UTC. The 13-minute offset avoids GitHub's busiest cron minute.
  schedule:
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    - cron: '13 12 * * *'
    - cron: '13 13 * * *'
    - cron: '13 14 * * *'
    - cron: '13 15 * * *'
    - cron: '13 16 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Select today's randomized publication time
        id: timing
        run: node tools/ai-marketing/publication-window.mjs --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" --base-hour 10 --salt daily-blog

      - name: Wait until the selected publication time
        if: github.event_name == 'schedule' && steps.timing.outputs.publish == 'true'
        run: sleep "${{ steps.timing.outputs.wait_seconds }}"

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: cd tools/ai-marketing && npm install

      - name: Generate daily blog post
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CI: true
          GITHUB_ACTIONS: true
        run: node tools/ai-marketing/daily-blog.mjs

      - name: Synchronize the indexable-page sitemap
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: node tools/sync-sitemap.mjs

      - name: Validate all structured data before publishing
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: node tools/validate-jsonld.mjs public

      - name: Commit and push
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: |
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add -A
          if git diff --staged --quiet; then
            echo "::error::Daily Blog Post generated no file changes. Check the keyword queue, progress file, and Gemini output."
            exit 1
          fi
          git commit -m "Daily blog post $(date +%Y-%m-%d)"
          # Pull latest changes (in case you pushed manually), then push
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Trigger Pages deploy for new post
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main

      - name: Trigger IZEM video for new post
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POST_SLUG=$(node -e "const fs = require('fs'); const progress = JSON.parse(fs.readFileSync('tools/ai-marketing/.daily-progress.json', 'utf8')); const post = progress.generated && progress.generated[progress.generated.length - 1]; if (!post || !post.slug) { console.error('No generated post slug found in daily progress file.'); process.exit(1); } process.stdout.write(post.slug);")
          echo "Triggering IZEM video for ${POST_SLUG}"
          gh workflow run "Daily IZEM YouTube Video" --ref main -f post_slug="${POST_SLUG}"

      - name: Ping Google sitemap
        if: success() && (github.event_name != 'schedule' || steps.timing.outputs.publish == 'true')
        run: node tools/ai-marketing/google-indexing.mjs || true
