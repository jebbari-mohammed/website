name: Daily Blog Post

on:
  # One of these hourly checks publishes at a daily pseudo-random time between
  # 10:00 and 17:00 UTC. The 13-minute offset avoids GitHub's busiest cron minute.
  schedule:
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    - cron: '13 12 * * *'
    - cron: '13 13 * * *'
    - cron: '13 14 * * *'
    - cron: '13 15 * * *'
    - cron: '13 16 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Select today's randomized publication time
        id: timing
        run: node tools/ai-marketing/publication-window.mjs --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" --base-hour 10 --salt daily-blog

      - name: Wait until the selected publication time
        if: github.event_name == 'schedule' && steps.timing.outputs.publish == 'true'
        run: sleep "${{ steps.timing.outputs.wait_seconds }}"

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AI marketing dependencies
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: cd tools/ai-marketing && npm install

      - name: Restore private SEO publication cooldown state
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: data/marketing-employee/seo-growth/publish-state.json
          key: seo-growth-publish-state-${{ github.run_id }}
          restore-keys: |
            seo-growth-publish-state-

      - name: Pull fresh Search Console data and build SEO plan
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: sc-domain:youraicoach.life
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "📥 Pulling fresh 28-day Search Console query + page data..."
            node tools/ai-marketing/search-console.mjs --days 28 --dimensions query,page --row-limit 2500 --output latest-28d.json
          else
            echo "⚠️ GOOGLE_SERVICE_ACCOUNT_JSON is not configured. No SEO page will be published from guessed demand."
          fi
          node tools/ai-marketing/seo-growth-engine.mjs

      - name: Apply highest-leverage GSC-backed site change
        id: publish
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: gemini-3.5-flash
          CI: true
          GITHUB_ACTIONS: true
        run: node tools/ai-marketing/gsc-publish.mjs

      - name: Rebuild blog index and RSS
        if: steps.publish.outputs.changed == 'true'
        run: node tools/ai-marketing/rebuild-blog-index.mjs

      - name: Synchronize the indexable-page sitemap
        if: steps.publish.outputs.changed == 'true'
        run: node tools/sync-sitemap.mjs

      - name: Validate all structured data before publishing
        if: steps.publish.outputs.changed == 'true'
        run: node tools/validate-jsonld.mjs public

      - name: Commit and push GSC-backed SEO change
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"

          # Publish only website files. Raw GSC exports and the detailed private
          # opportunity plan remain gitignored; cooldown state persists in the
          # GitHub Actions cache instead of the public repository.
          git add public/

          if git diff --staged --quiet; then
            echo "No public website changes to commit."
            exit 0
          fi

          git commit -m "seo: ${{ steps.publish.outputs.action }} ${{ steps.publish.outputs.slug }}"
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Trigger Pages deploy for SEO change
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main

      - name: Trigger IZEM video for a newly created post
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action == 'create' && steps.publish.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering IZEM video for ${{ steps.publish.outputs.slug }}"
          gh workflow run "Daily IZEM YouTube Video" --ref main -f post_slug="${{ steps.publish.outputs.slug }}"

      - name: Ping Google sitemap
        if: steps.publish.outputs.changed == 'true'
        run: node tools/ai-marketing/google-indexing.mjs || true
