name: Daily Blog Post

on:
  # Runs every day at 7:00 AM UTC (8:00 AM Morocco time)
  # A random delay of 0-120 minutes is added before generating
  schedule:
    # TEMP TEST: run at 18:20 UTC on May 9 so GitHub can verify the publish chain.
    - cron: '20 18 9 5 *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0-120 min) for natural timing
        if: false # TEMP TEST: skip random delay
        run: |
          DELAY=$((RANDOM % 7200))
          echo "⏳ Waiting ${DELAY} seconds ($(($DELAY / 60)) minutes) before publishing..."
          sleep $DELAY

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd tools/ai-marketing && npm install

      - name: Generate daily blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CI: true
          GITHUB_ACTIONS: true
        run: node tools/ai-marketing/daily-blog.mjs

      - name: Commit and push
        run: |
          git config user.name "AI Marketing Bot"
          git config user.email "bot@youraicoach.life"
          git add -A
          if git diff --staged --quiet; then
            echo "::error::Daily Blog Post generated no file changes. Check the keyword queue, progress file, and Gemini output."
            exit 1
          fi
          git commit -m "📝 Daily blog post $(date +%Y-%m-%d)"
          # Pull latest changes (in case you pushed manually), then push
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Ping Google sitemap
        if: success()
        run: node tools/ai-marketing/google-indexing.mjs || true
