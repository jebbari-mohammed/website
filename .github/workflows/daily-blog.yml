name: Daily SEO Production

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the full private GSC and Gemini pipeline without changing the site
        required: false
        default: false
        type: boolean
      force:
        description: Ignore publication cooldowns for an explicitly supervised manual run
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: seo-production
  cancel-in-progress: false

jobs:
  produce:
    name: Evidence-driven SEO action
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GSC_SITE_URL: sc-domain:youraicoach.life
      SEO_GEMINI_MODEL: gemini-3.6-flash
      SEO_GEMINI_MODELS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}

    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify required private credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          set -euo pipefail
          [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is missing"; exit 1; }
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GEMINI_API_KEY_2:-}" ] && [ -z "${GEMINI_API_KEY_3:-}" ]; then
            echo "::error::At least one Gemini API key is required"
            exit 1
          fi
          node - <<'NODE'
          const value = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_JSON);
          if (value.type !== 'service_account' || !value.client_email || !value.private_key) {
            throw new Error('Search Console secret is not a valid service-account JSON credential');
          }
          console.log('Credential structure verified without printing sensitive values.');
          NODE

      - name: Restore private experiment and cooldown state
        uses: actions/cache@v4
        with:
          path: |
            data/marketing-employee/seo-growth/publish-state-v2.json
            data/marketing-employee/seo-growth/experiments-v2.json
          key: seo-production-state-v2-${{ github.run_id }}
          restore-keys: |
            seo-production-state-v2-

      - name: Run deterministic SEO tests
        run: pnpm test:seo-growth

      - name: Pull private Search Console query and landing-page evidence
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: pnpm gsc:private

      - name: Build private base opportunity plan
        run: |
          set -euo pipefail
          node tools/ai-marketing/seo-growth-engine.mjs \
            --gsc tools/ai-marketing/search-console-reports/latest-28d.json \
            --require-gsc > /tmp/seo-base-planner.log
          echo "Base plan completed. Exact query output stayed private."

      - name: Apply senior-level value, confidence, risk, and cannibalization gates
        run: pnpm seo:expert

      - name: Verify current Gemini SDK, keys, and model fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: pnpm seo:smoke:gemini

      - name: Research, draft, critique, validate, and prepare the best action
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SEO_PLAN_PATH: data/marketing-employee/seo-growth/expert-latest.json
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE_RUN" = "true" ] && args+=(--force)
          node tools/ai-marketing/seo-production.mjs "${args[@]}"

      - name: Generate a production PNG social card for a new page
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action == 'create'
        run: node tools/ai-marketing/seo-og-card.mjs

      - name: Rebuild discovery files and validate the complete site
        if: steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node tools/ai-marketing/rebuild-blog-index.mjs
          pnpm sitemap:sync
          node tools/validate-jsonld.mjs public
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links

      - name: Commit only public website files
        if: steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "IZEM SEO Production"
          git config user.email "seo-production@youraicoach.life"
          git add public/

          if git diff --cached --name-only | grep -E 'search-console-reports|marketing-employee/seo-growth'; then
            echo "::error::Private SEO evidence was accidentally staged"
            exit 1
          fi

          git diff --cached --quiet && { echo "::error::Publisher reported a change but no public file is staged"; exit 1; }
          git commit -m "seo: ${{ steps.publish.outputs.action }} ${{ steps.publish.outputs.query_hash }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify the exact SEO change reached the live site
        if: steps.publish.outputs.changed == 'true'
        run: |
          node tools/ai-marketing/verify-live-seo.mjs \
            --url "${{ steps.publish.outputs.url }}" \
            --marker "${{ steps.publish.outputs.marker }}"

      - name: Trigger the existing video workflow for a new article
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Daily IZEM YouTube Video" --ref main -f post_slug="${{ steps.publish.outputs.slug }}"

      - name: Notify search engines after verified publication
        if: steps.publish.outputs.changed == 'true'
        run: node tools/ai-marketing/google-indexing.mjs || true

      - name: Write privacy-safe SEO run summary
        if: always()
        run: |
          {
            echo "### IZEM SEO production"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Action: ${{ steps.publish.outputs.action || 'none' }}"
            echo "- Query hash: ${{ steps.publish.outputs.query_hash || 'none' }}"
            echo "- Validation passed: ${{ steps.publish.outputs.validated || 'false' }}"
            echo "- Public change: ${{ steps.publish.outputs.changed || 'false' }}"
            if [ "${{ steps.publish.outputs.changed }}" = "true" ]; then
              echo "- Live URL: ${{ steps.publish.outputs.url }}"
              echo "- Deployment marker: ${{ steps.publish.outputs.marker }}"
            fi
            echo "- Exact Search Console queries were never printed or committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a health issue when production fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="[SEO Automation] Production pipeline needs attention"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The privacy-safe SEO production pipeline failed on $(date -u +%Y-%m-%d). Review the workflow run: ${run_url}. No exact Search Console queries are included in this issue."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a recovered health issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[SEO Automation] Production pipeline needs attention"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The SEO production pipeline completed successfully in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
