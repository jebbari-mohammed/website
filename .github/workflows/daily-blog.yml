name: Manual SEO Production Fallback (Gemini)

# Manual-only fallback. The scheduled ChatGPT senior SEO lead owns production decisions.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the full private GSC and Gemini fallback pipeline without changing the site
        required: false
        default: false
        type: boolean
      force:
        description: Ignore publication cooldowns for an explicitly supervised manual fallback run
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: seo-production
  cancel-in-progress: false

jobs:
  produce:
    name: Evidence-driven SEO action
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GSC_SITE_URL: https://youraicoach.life/
      SEO_GEMINI_MODEL: gemini-3.6-flash
      SEO_GEMINI_MODELS: gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-pro-preview,gemini-3.5-flash-lite
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}

    steps:
      - name: Checkout current production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether Search Console production access is verified
        id: gsc_ready
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('public/seo-system-version.json', 'utf8'));
          const ready = value.searchConsoleVerified === true && value.searchConsoleProperty === 'https://youraicoach.life/';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready ? 'true' : 'false'}\n`);
          console.log(`Search Console production readiness: ${ready ? 'verified' : 'pending bootstrap'}.`);
          NODE

      - name: Report a safe no-action run while Search Console is pending
        if: steps.gsc_ready.outputs.ready != 'true'
        run: |
          {
            echo "### IZEM SEO production fallback"
            echo "- Search Console: pending one-time ownership bootstrap"
            echo "- Public SEO change: none"
            echo "- Guessed keyword fallback: disabled"
            echo "- The Search Console health workflow will expose production evidence after verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the private Search Console credential
        if: steps.gsc_ready.outputs.ready == 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] && [ -z "${GOOGLE_CLOUD_JSON:-}" ] && [ -z "${GCP_SA_KEY:-}" ] && [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            echo "::error::No Google service-account credential is configured"
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { discoverCredentialSource, parseServiceAccountCredential } from './tools/ai-marketing/gsc-fetch-private.mjs';
          const source = discoverCredentialSource(process.env);
          parseServiceAccountCredential(process.env[source], source);
          console.log(`Search Console credential structure verified through ${source} without printing sensitive values.`);
          NODE

      - name: Pull private Search Console query and landing-page evidence
        if: steps.gsc_ready.outputs.ready == 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: pnpm gsc

      - name: Evaluate whether private Search Console evidence is available
        id: gsc_evidence
        if: steps.gsc_ready.outputs.ready == 'true'
        run: pnpm gsc:evidence

      - name: Report a verified zero-row no-action run
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available != 'true'
        env:
          GSC_EVIDENCE_ROW_COUNT: ${{ steps.gsc_evidence.outputs.row_count || '0' }}
        run: |
          {
            echo "### Verified Search Console, awaiting evidence"
            echo "- Search Console ownership and private query+page API access: verified"
            echo "- Private query+page rows: ${GSC_EVIDENCE_ROW_COUNT}"
            echo "- Public SEO change: none"
            echo "- Deterministic production suite: skipped"
            echo "- Gemini credential check, smoke, drafting, and review calls: skipped"
            echo "- Guessed keyword fallback: disabled"
            echo "- This manual fallback can be run after Search Console returns rows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Gemini credentials only when evidence exists
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GEMINI_API_KEY_2:-}" ] && [ -z "${GEMINI_API_KEY_3:-}" ]; then
            echo "::error::At least one Gemini API key is required for this optional manual fallback"
            exit 1
          fi
          echo "At least one Gemini credential is configured; values were not printed."

      - name: Restore encrypted experiment and cooldown state
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/seo-private-cache/envelope.json
          key: seo-production-private-v1-${{ github.run_id }}
          restore-keys: |
            seo-production-private-v1-

      - name: Authenticate private cooldown state before publication
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        env:
          SEO_PRIVATE_CACHE_FILE: ${{ runner.temp }}/seo-private-cache/envelope.json
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/ai-marketing/seo-private-state-cache.mjs restore

      - name: Run deterministic SEO tests
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        run: pnpm test:seo-growth

      - name: Build private base opportunity plan
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        run: |
          set -euo pipefail
          node tools/ai-marketing/seo-growth-engine.mjs \
            --gsc tools/ai-marketing/search-console-reports/latest-28d.json \
            --require-gsc > /tmp/seo-base-planner.log
          echo "Base plan completed. Exact query output stayed private."

      - name: Apply senior-level value, confidence, risk, and cannibalization gates
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        run: pnpm seo:expert

      - name: Verify current Gemini SDK, keys, and model fallback
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: pnpm seo:smoke:gemini

      - name: Research, draft, critique, validate, and prepare the best action
        id: publish
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        env:
          SEO_PLAN_PATH: data/marketing-employee/seo-growth/expert-latest.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE_RUN" = "true" ] && args+=(--force)
          node tools/ai-marketing/seo-production-runner.mjs "${args[@]}"

      - name: Encrypt updated cooldown state before public commit
        if: steps.gsc_ready.outputs.ready == 'true' && steps.gsc_evidence.outputs.evidence_available == 'true'
        env:
          SEO_PRIVATE_CACHE_FILE: ${{ runner.temp }}/seo-private-cache/envelope.json
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/ai-marketing/seo-private-state-cache.mjs save

      - name: Generate a production PNG social card for a new page
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action == 'create'
        run: node tools/ai-marketing/seo-og-card.mjs

      - name: Rebuild discovery files and validate the complete site
        if: steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node tools/ai-marketing/rebuild-blog-index.mjs
          pnpm sitemap:sync
          node tools/sync-news-sitemap.mjs
          node tools/validate-jsonld.mjs public
          pnpm build
          node tools/validate-jsonld.mjs dist
          node tools/check-critical-routes.mjs dist
          pnpm check:links
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

      - name: Commit only public website files
        if: steps.publish.outputs.changed == 'true'
        env:
          PUBLISH_ACTION: ${{ steps.publish.outputs.action }}
          PUBLISH_QUERY_HASH: ${{ steps.publish.outputs.query_hash }}
        run: |
          set -euo pipefail
          git config user.name "IZEM SEO Production"
          git config user.email "seo-production@youraicoach.life"
          git add public/
          if git diff --cached --name-only | grep -E 'search-console-reports|marketing-employee/seo-growth'; then
            echo "::error::Private SEO evidence was accidentally staged"
            exit 1
          fi
          git diff --cached --quiet && { echo "::error::Publisher reported a change but no public file is staged"; exit 1; }
          git commit -m "seo: ${PUBLISH_ACTION} ${PUBLISH_QUERY_HASH}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Trigger transactional media completion for a new page
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_SLUG: ${{ steps.publish.outputs.slug }}
        run: |
          gh workflow run "Daily IZEM YouTube Video" --ref main -f post_slug="${PUBLISH_SLUG}"
          {
            echo "### New-page release handoff"
            echo "The article source is committed, but Pages deployment is intentionally deferred until the object-only visuals and validated NotebookLM/YouTube video are attached."
            echo "The media workflow now owns final release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify an existing-page refresh reached the live site
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action != 'create'
        env:
          PUBLISH_URL: ${{ steps.publish.outputs.url }}
          PUBLISH_MARKER: ${{ steps.publish.outputs.marker }}
        run: |
          node tools/ai-marketing/verify-live-seo.mjs \
            --url "${PUBLISH_URL}" \
            --marker "${PUBLISH_MARKER}"

      - name: Check discovery files after a verified existing-page refresh
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.action != 'create'
        run: node tools/ai-marketing/google-indexing.mjs || true

      - name: Write privacy-safe SEO run summary
        if: always() && steps.gsc_ready.outputs.ready == 'true'
        env:
          GSC_EVIDENCE_ROW_COUNT: ${{ steps.gsc_evidence.outputs.row_count || '0' }}
          GSC_EVIDENCE_EVIDENCE_AVAILABLE: ${{ steps.gsc_evidence.outputs.evidence_available || 'false' }}
          PUBLISH_ACTION: ${{ steps.publish.outputs.action || 'none' }}
          PUBLISH_QUERY_HASH: ${{ steps.publish.outputs.query_hash || 'none' }}
          PUBLISH_GROUNDED: ${{ steps.publish.outputs.grounded || 'false' }}
          PUBLISH_VALIDATED: ${{ steps.publish.outputs.validated || 'false' }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed || 'false' }}
          PUBLISH_URL: ${{ steps.publish.outputs.url }}
          PUBLISH_MARKER: ${{ steps.publish.outputs.marker }}
        run: |
          {
            echo "### IZEM SEO production fallback"
            echo "- Search Console: verified URL-prefix property"
            echo "- Private query+page rows: ${GSC_EVIDENCE_ROW_COUNT}"
            echo "- Evidence available: ${GSC_EVIDENCE_EVIDENCE_AVAILABLE}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Action: ${PUBLISH_ACTION}"
            echo "- Query hash: ${PUBLISH_QUERY_HASH}"
            echo "- Live search grounded: ${PUBLISH_GROUNDED}"
            echo "- Validation passed: ${PUBLISH_VALIDATED}"
            echo "- Public change: ${PUBLISH_CHANGED}"
            if [ "${PUBLISH_CHANGED}" = "true" ]; then
              echo "- Target URL: ${PUBLISH_URL}"
              echo "- Deployment marker: ${PUBLISH_MARKER}"
              if [ "${PUBLISH_ACTION}" = "create" ]; then
                echo "- Release status: pending transactional media completion (not prematurely deployed)"
              else
                echo "- Release status: existing-page refresh verified live"
              fi
            fi
            echo "- Exact Search Console queries were never printed or committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a health issue when verified production fails
        if: failure() && steps.gsc_ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="[SEO Automation] Production fallback needs attention"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The optional privacy-safe SEO production fallback failed on $(date -u +%Y-%m-%d). Review ${run_url}. No exact Search Console queries are included."
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Close a recovered production health issue
        if: success() && steps.gsc_ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[SEO Automation] Production fallback needs attention"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The optional GSC-backed SEO production fallback recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

      - name: Delete local plaintext Search Console and decision evidence
        if: always()
        run: |
          rm -rf -- tools/ai-marketing/search-console-reports/ data/marketing-employee/seo-growth/
          rm -f -- /tmp/seo-base-planner.log /tmp/izem-seo-smoke-plan.json
