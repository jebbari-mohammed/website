name: Daily Blog Post

on:
  # Runs every day at 10:00 AM UTC (11:00 AM Morocco time)
  schedule:
    - cron: '0 10 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd tools/ai-marketing && npm install

      - name: Generate daily blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CI: true
          GITHUB_ACTIONS: true
        run: node tools/ai-marketing/daily-blog.mjs

      - name: Commit and push
        run: |
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add -A
          if git diff --staged --quiet; then
            echo "::error::Daily Blog Post generated no file changes. Check the keyword queue, progress file, and Gemini output."
            exit 1
          fi
          git commit -m "Daily blog post $(date +%Y-%m-%d)"
          # Pull latest changes (in case you pushed manually), then push
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Trigger Pages deploy for new post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main

      - name: Trigger IZEM video for new post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POST_SLUG=$(node -e "const fs = require('fs'); const progress = JSON.parse(fs.readFileSync('tools/ai-marketing/.daily-progress.json', 'utf8')); const post = progress.generated && progress.generated[progress.generated.length - 1]; if (!post || !post.slug) { console.error('No generated post slug found in daily progress file.'); process.exit(1); } process.stdout.write(post.slug);")
          echo "Triggering IZEM video for ${POST_SLUG}"
          gh workflow run "Daily IZEM YouTube Video" --ref main -f post_slug="${POST_SLUG}"

      - name: Ping Google sitemap
        if: success()
        run: node tools/ai-marketing/google-indexing.mjs || true
