name: Daily SEO Evidence

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-evidence
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Search Console evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GSC_SITE_URL: https://youraicoach.life/
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether Search Console production access is verified
        id: gsc_ready
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('public/seo-system-version.json', 'utf8'));
          const ready = value.searchConsoleVerified === true && value.searchConsoleProperty === 'https://youraicoach.life/';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready ? 'true' : 'false'}\n`);
          console.log(`Search Console production readiness: ${ready ? 'verified' : 'pending'}.`);
          NODE

      - name: Report pending Search Console access
        if: steps.gsc_ready.outputs.ready != 'true'
        run: |
          {
            echo "### IZEM SEO evidence"
            echo "- Search Console: pending"
            echo "- Public SEO change: none"
            echo "- Decision owner: ChatGPT senior SEO lead"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the private Search Console credential
        if: steps.gsc_ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] && [ -z "${GOOGLE_CLOUD_JSON:-}" ] && [ -z "${GCP_SA_KEY:-}" ] && [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            echo "::error::No Google service-account credential is configured"
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { discoverCredentialSource, parseServiceAccountCredential } from './tools/ai-marketing/gsc-fetch-private.mjs';
          const source = discoverCredentialSource(process.env);
          parseServiceAccountCredential(process.env[source], source);
          console.log(`Search Console credential structure verified through ${source} without printing sensitive values.`);
          NODE

      - name: Pull private Search Console query and landing-page evidence
        if: steps.gsc_ready.outputs.ready == 'true'
        run: pnpm gsc

      - name: Evaluate whether private Search Console evidence is available
        id: gsc_evidence
        if: steps.gsc_ready.outputs.ready == 'true'
        run: pnpm gsc:evidence

      - name: Validate crawl and indexability guardrails
        if: steps.gsc_ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node tools/ai-marketing/legacy-content-audit.mjs --strict
          pnpm sitemap:check
          node tools/sync-news-sitemap.mjs --check

      - name: Write privacy-safe evidence summary
        if: always() && steps.gsc_ready.outputs.ready == 'true'
        run: |
          {
            echo "### IZEM SEO evidence"
            echo "- Search Console: verified URL-prefix property"
            echo "- Private query+page rows: ${{ steps.gsc_evidence.outputs.row_count || '0' }}"
            echo "- Evidence available: ${{ steps.gsc_evidence.outputs.evidence_available || 'false' }}"
            echo "- Public SEO change: none"
            echo "- Gemini/API strategy calls: none"
            echo "- Autonomous publishing: disabled"
            echo "- Decision owner: ChatGPT senior SEO lead"
            echo "- Exact Search Console queries remain private and are not printed or committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a health issue when evidence collection fails
        if: failure() && steps.gsc_ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="[SEO Evidence] Search Console collection needs attention"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The privacy-safe Search Console evidence collector failed on $(date -u +%Y-%m-%d). Review ${run_url}. No exact Search Console queries are included."
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Close a recovered evidence health issue
        if: success() && steps.gsc_ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[SEO Evidence] Search Console collection needs attention"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Search Console evidence collection recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
