name: Agent readiness

on:
  pull_request:
    paths:
      - 'functions/agent-pages/**'
      - 'tools/agent-metadata.test.mjs'
      - 'tools/agent-deploy.test.mjs'
      - 'tools/check-agent-deploy-access*.mjs'
      - 'tools/verify-agent-readiness*.mjs'
      - 'tools/workflow-security.test.mjs'
      - 'tools/workflow-action-pins.json'
      - 'index.html'
      - 'public/llms.txt'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/agent-readiness.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: agent-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix functions/agent-pages --ignore-scripts --no-audit --no-fund
      - run: pnpm test:agents
      - run: pnpm test:security
      - run: pnpm build
      - run: pnpm prepare:agent-hosting
      - run: AGENT_METADATA_ROOT=dist node --test tools/agent-metadata.test.mjs
      - run: npm install --global firebase-tools@15.29.0
      - run: FIREBASE_TOOLS_ROOT="$(npm root --global)/firebase-tools" node --test tools/agent-deploy.test.mjs
      - run: firebase emulators:exec --only hosting,functions --project demo-izem-agent-readiness 'node tools/verify-agent-readiness.mjs http://127.0.0.1:5000'
