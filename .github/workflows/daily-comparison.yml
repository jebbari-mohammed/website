name: Daily Competitor Landing Page

on:
  # Publishes once per day at a pseudo-random time between 07:00 and 14:00 UTC.
  schedule:
    - cron: '13 7 * * *'
    - cron: '13 8 * * *'
    - cron: '13 9 * * *'
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    - cron: '13 12 * * *'
    - cron: '13 13 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Select today's randomized publication time
        id: timing
        run: node tools/ai-marketing/publication-window.mjs --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" --base-hour 7 --salt daily-comparison

      - name: Wait until the selected publication time
        if: github.event_name == 'schedule' && steps.timing.outputs.publish == 'true'
        run: sleep "${{ steps.timing.outputs.wait_seconds }}"

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: cd tools/ai-marketing && npm install

      - name: Generate competitor landing page
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
          GITHUB_ACTIONS: true
        run: node tools/ai-marketing/daily-comparison.mjs

      - name: Synchronize the indexable-page sitemap
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: node tools/sync-sitemap.mjs

      - name: Validate all structured data before publishing
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: node tools/validate-jsonld.mjs public

      - name: Commit and push
        if: github.event_name != 'schedule' || steps.timing.outputs.publish == 'true'
        run: |
          git config user.name "IZEM Editorial"
          git config user.email "editorial@youraicoach.life"
          git add -A
          if git diff --staged --quiet; then
            echo "::error::Daily Competitor Landing Page generated no file changes. Check the competitor queue, progress file, and Gemini output."
            exit 1
          fi
          git commit -m "🚀 Auto-generated competitor landing page $(date +%Y-%m-%d)"
          # Pull latest changes (in case you pushed manually), then push
          git pull --rebase origin main || (git rebase --abort && sleep 5 && git pull --rebase origin main)
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: Trigger Pages deploy
        if: success() && (github.event_name != 'schedule' || steps.timing.outputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy static content to Pages" --ref main
