name: Harden verified zero-row GSC production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gsc-zero-row-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-zero-row-gsc-production
  cancel-in-progress: false

jobs:
  harden:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GSC_SITE_URL: https://youraicoach.life/

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add a private evidence gate and safe publisher zero-row state
        run: |
          set -euo pipefail
          cat > tools/ai-marketing/gsc-evidence-gate.mjs <<'EOF'
          #!/usr/bin/env node

          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { fileURLToPath } from 'node:url';

          const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '../..');
          const DEFAULT_REPORT = path.join(ROOT, 'tools/ai-marketing/search-console-reports/latest-28d.json');

          function setOutput(name, value) {
            if (!process.env.GITHUB_OUTPUT) return;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value).replace(/\r?\n/g, ' ')}\n`);
          }

          export function evaluateGscEvidence(report) {
            if (!report || typeof report !== 'object') throw new Error('Search Console report is not an object');
            const dimensions = Array.isArray(report.dimensions) ? report.dimensions : [];
            if (!dimensions.includes('query') || !dimensions.includes('page')) {
              throw new Error('Search Console report must include private query and page dimensions');
            }
            if (!Array.isArray(report.rows)) throw new Error('Search Console report rows must be an array');
            const rowCount = report.rows.length;
            return {
              rowCount,
              evidenceAvailable: rowCount > 0,
              site: String(report.site || ''),
              startDate: String(report.startDate || ''),
              endDate: String(report.endDate || ''),
            };
          }

          export function readEvidenceReport(file = DEFAULT_REPORT) {
            return evaluateGscEvidence(JSON.parse(fs.readFileSync(file, 'utf8')));
          }

          const invokedDirectly = process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url);
          if (invokedDirectly) {
            try {
              const result = readEvidenceReport(process.argv[2] ? path.resolve(process.argv[2]) : DEFAULT_REPORT);
              setOutput('row_count', result.rowCount);
              setOutput('evidence_available', result.evidenceAvailable ? 'true' : 'false');
              console.log(`Private GSC evidence gate: ${result.rowCount} query+page row(s); publication evidence ${result.evidenceAvailable ? 'available' : 'not yet available'}.`);
            } catch (error) {
              console.error(`Private GSC evidence gate failed: ${error instanceof Error ? error.message : String(error)}`);
              process.exitCode = 1;
            }
          }
          EOF

          cat > tools/ai-marketing/gsc-evidence-gate.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { evaluateGscEvidence } from './gsc-evidence-gate.mjs';

          test('treats a valid new zero-row property as verified no-evidence rather than an error', () => {
            assert.deepEqual(evaluateGscEvidence({
              site: 'https://youraicoach.life/',
              dimensions: ['query', 'page'],
              rows: [],
            }), {
              rowCount: 0,
              evidenceAvailable: false,
              site: 'https://youraicoach.life/',
              startDate: '',
              endDate: '',
            });
          });

          test('allows evidence-backed production only when private rows exist', () => {
            const result = evaluateGscEvidence({
              dimensions: ['query', 'page'],
              rows: [{ keys: ['private query', 'https://youraicoach.life/example'], impressions: 3 }],
            });
            assert.equal(result.rowCount, 1);
            assert.equal(result.evidenceAvailable, true);
          });

          test('fails closed for reports without both private dimensions', () => {
            assert.throws(() => evaluateGscEvidence({ dimensions: ['page'], rows: [] }), /query and page/);
            assert.throws(() => evaluateGscEvidence({ dimensions: ['query', 'page'] }), /rows must be an array/);
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('tools/ai-marketing/seo-production.mjs')
          source = path.read_text()
          old = '''  const plan = readJson(args.plan, null);
            assertFreshPlan(plan);
            const state = readJson(args.state, { version: 2, actions: {} });
          '''
          new = '''  const plan = readJson(args.plan, null);
            const verifiedZeroRowPlan = Boolean(
              plan &&
              Number(plan.summary?.gscRows || 0) === 0 &&
              Array.isArray(plan.opportunities) &&
              plan.opportunities.length === 0 &&
              plan.source?.gscReport &&
              Array.isArray(plan.source?.dimensions) &&
              plan.source.dimensions.includes('query') &&
              plan.source.dimensions.includes('page')
            );
            if (verifiedZeroRowPlan) {
              console.log('No eligible automatic CREATE/REFRESH action cleared freshness, confidence, value, cooldown, and idempotency gates. Search Console returned zero private query+page evidence rows, so no demand was guessed.');
              return;
            }
            assertFreshPlan(plan);
            const state = readJson(args.state, { version: 2, actions: {} });
          '''
          if source.count(old) != 1:
              raise SystemExit('Expected publisher plan assertion block exactly once')
          path.write_text(source.replace(old, new))
          PY

          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const testFile = 'tools/ai-marketing/gsc-evidence-gate.test.mjs';
          let command = packageJson.scripts['test:seo-growth'];
          if (!command.includes(testFile)) {
            command = command.replace('node --test ', `node --test ${testFile} `);
            packageJson.scripts['test:seo-growth'] = command;
          }
          packageJson.scripts['gsc:evidence'] = 'node tools/ai-marketing/gsc-evidence-gate.mjs';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Run all deterministic tests
        run: |
          set -euo pipefail
          node --check tools/ai-marketing/gsc-evidence-gate.mjs
          node --check tools/ai-marketing/seo-production.mjs
          pnpm test:seo-growth

      - name: Reconfirm Search Console owner status
        id: status
        run: node tools/ai-marketing/gsc-url-prefix-bootstrap.mjs status

      - name: Require verified ownership
        run: |
          set -euo pipefail
          [ "${{ steps.status.outputs.ready }}" = "true" ]
          [ "${{ steps.status.outputs.status }}" = "verified" ]

      - name: Pull the current private query and page report
        run: pnpm gsc

      - name: Evaluate the current evidence state without exposing queries
        id: evidence
        run: pnpm gsc:evidence

      - name: Build zero-row plans and prove the publisher exits successfully without Gemini
        if: steps.evidence.outputs.evidence_available != 'true'
        id: publish
        run: |
          set -euo pipefail
          unset GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3
          node tools/ai-marketing/seo-growth-engine.mjs \
            --gsc tools/ai-marketing/search-console-reports/latest-28d.json \
            --require-gsc > /tmp/seo-base-planner.log
          pnpm seo:expert
          SEO_PLAN_PATH=data/marketing-employee/seo-growth/expert-latest.json \
            node tools/ai-marketing/seo-production-runner.mjs

      - name: Require a clean zero-row no-action result
        if: steps.evidence.outputs.evidence_available != 'true'
        run: |
          set -euo pipefail
          [ "${{ steps.publish.outputs.changed }}" = "false" ]
          [ "${{ steps.publish.outputs.action }}" = "none" ]
          [ "${{ steps.publish.outputs.validated }}" = "false" ]
          [ "${{ steps.publish.outputs.grounded }}" = "false" ]
          git diff --quiet -- public/
          echo "Verified new-property zero-row state: success, no Gemini call, no guessed demand, no public change."

      - name: Confirm the gate will open automatically when rows arrive
        if: steps.evidence.outputs.evidence_available == 'true'
        run: echo "Private evidence already exists; the production path should remain enabled."

      - name: Commit the verified zero-row hardening to main
        run: |
          set -euo pipefail
          git config user.name "IZEM SEO Validation"
          git config user.email "seo-validation@youraicoach.life"
          git add tools/ai-marketing/gsc-evidence-gate.mjs tools/ai-marketing/gsc-evidence-gate.test.mjs tools/ai-marketing/seo-production.mjs package.json
          git diff --cached --quiet && { echo "::error::No zero-row hardening change was staged"; exit 1; }
          git commit -m "fix: treat verified zero-row GSC as safe no-action"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
