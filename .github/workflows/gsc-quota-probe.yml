name: GSC Site Verification quota probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-marketing/siteverification-quota-probe.mjs'
      - 'tools/ai-marketing/siteverification-user-project-probe.mjs'
      - '.github/workflows/gsc-quota-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Probe API-key query-parameter quota
        id: key_quota
        continue-on-error: true
        run: node tools/ai-marketing/siteverification-quota-probe.mjs

      - name: Probe x-goog-user-project quota
        id: user_project
        run: node tools/ai-marketing/siteverification-user-project-probe.mjs

      - name: Require a supported quota path
        run: |
          set -euo pipefail
          if [ "${{ steps.key_quota.outputs.quota_usable }}" = "true" ]; then
            echo "Site Verification quota is available through API-key slot ${{ steps.key_quota.outputs.quota_key_slot }}."
            exit 0
          fi
          [ "${{ steps.user_project.outputs.user_project_usable }}" = "true" ]
          echo "Site Verification quota is available through x-goog-user-project (${ { steps.user_project.outputs.user_project_label } })."
