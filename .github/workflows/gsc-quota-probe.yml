name: GSC existing-credential capability probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-marketing/siteverification-quota-probe.mjs'
      - 'tools/ai-marketing/siteverification-user-project-probe.mjs'
      - 'tools/ai-marketing/google-service-account-capability-probe.mjs'
      - '.github/workflows/gsc-quota-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_JSON: ${{ secrets.GOOGLE_CLOUD_JSON }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      GOOGLE_CLOUD_KEY: ${{ secrets.GOOGLE_CLOUD_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
      FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Exhaustively probe existing service-account credentials
        id: accounts
        run: node tools/ai-marketing/google-service-account-capability-probe.mjs

      - name: Probe API-key query-parameter quota
        id: key_quota
        if: failure()
        continue-on-error: true
        run: node tools/ai-marketing/siteverification-quota-probe.mjs

      - name: Probe x-goog-user-project quota
        id: user_project
        if: failure()
        run: node tools/ai-marketing/siteverification-user-project-probe.mjs

      - name: Summarize supported path
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.accounts.outputs.capable }}" = "true" ]; then
            echo "A capable Google credential already exists: ${{ steps.accounts.outputs.credential_name }} (${{ steps.accounts.outputs.mode }})."
            exit 0
          fi
          if [ "${{ steps.key_quota.outputs.quota_usable }}" = "true" ]; then
            echo "Site Verification quota is available through API-key slot ${{ steps.key_quota.outputs.quota_key_slot }}."
            exit 0
          fi
          [ "${{ steps.user_project.outputs.user_project_usable }}" = "true" ]
          echo "Site Verification quota is available through x-goog-user-project (${{ steps.user_project.outputs.user_project_label }})."
