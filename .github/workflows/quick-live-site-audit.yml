name: One-time live website audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-live-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check key production routes
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          check_route() {
            path="$1"
            expected="${2:-}"
            forbidden="${3:-}"
            body=$(mktemp)
            separator='?'
            case "$path" in *\?*) separator='&' ;; esac
            url="https://youraicoach.life${path}${separator}live_audit=${RUN_ID}"
            code=$(curl -L -sS --max-time 30 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "$url" || true)
            echo "$path -> HTTP ${code:-curl-error} ($(wc -c < "$body") bytes)"

            if [ "$code" != "200" ] || [ ! -s "$body" ]; then
              echo "::error::Route failed: $path"
              rm -f "$body"
              return 1
            fi
            if grep -Eqi 'Page not found|<title>404|404 -' "$body"; then
              echo "::error::Route rendered a not-found page: $path"
              rm -f "$body"
              return 1
            fi
            if [ -n "$expected" ] && ! grep -Fqi "$expected" "$body"; then
              echo "::error::Expected marker missing on $path: $expected"
              rm -f "$body"
              return 1
            fi
            if [ -n "$forbidden" ] && grep -Fqi "$forbidden" "$body"; then
              echo "::error::Forbidden stale marker found on $path: $forbidden"
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
            return 0
          }

          failures=0
          check_route '/' 'IZEM AI Fitness Coach | Plans, Chat, Scans & Live Calls' || failures=$((failures+1))
          check_route '/best-ai-fitness-app' 'Best AI Fitness App in 2026: Coach-or-Tracker Test' 'We consolidated this comparison' || failures=$((failures+1))
          check_route '/blog/' 'IZEM Blog:' || failures=$((failures+1))
          check_route '/youtube/' 'IZEM on YouTube' || failures=$((failures+1))
          check_route '/privacy-policy.html' 'Privacy Policy' || failures=$((failures+1))
          check_route '/terms.html' 'Terms' || failures=$((failures+1))
          check_route '/support.html' 'Support' || failures=$((failures+1))
          check_route '/tools/' || failures=$((failures+1))
          check_route '/comparisons/' || failures=$((failures+1))
          check_route '/sitemap.xml' '<urlset' || failures=$((failures+1))
          check_route '/blog/chatgpt-vs-fitness-app-workouts' 'ChatGPT vs Fitness App' || failures=$((failures+1))
          check_route '/youtube/a_jG-ssT1tk/' 'ChatGPT vs Fitness App for Workouts' || failures=$((failures+1))

          if [ "$failures" -ne 0 ]; then
            echo "::error::Live audit found $failures failing route(s)."
            exit 1
          fi

          echo 'All selected live routes passed.'
