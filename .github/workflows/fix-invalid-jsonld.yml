name: Fix invalid beginner article JSON-LD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-invalid-jsonld.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair invalid FAQ structured data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/blog/ai-workout-generator-beginners.html')
          html = path.read_text(encoding='utf-8')
          broken = '"text": undefined'
          replacement = '"text": "An AI workout generator can help healthy beginners start with conservative plans, clear exercise instructions, and gradual progression, but it cannot guarantee safe form or replace a qualified professional. Anyone with pain, an injury, a medical condition, or uncertainty about technique should seek professional guidance."'

          occurrences = html.count(broken)
          if occurrences != 1:
              raise SystemExit(f'Expected exactly one invalid FAQ value, found {occurrences}')

          path.write_text(html.replace(broken, replacement), encoding='utf-8')
          PY

      - name: Validate all JSON-LD blocks in repaired article
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/blog/ai-workout-generator-beginners.html', 'utf8');
          const blocks = [...html.matchAll(/<script\s+type=["']application\/ld\+json["']>([\s\S]*?)<\/script>/gi)];
          if (!blocks.length) throw new Error('No JSON-LD blocks found');
          for (const [, json] of blocks) JSON.parse(json.trim());
          console.log(`Validated ${blocks.length} JSON-LD blocks.`);
          NODE

      - name: Commit repair and remove this temporary workflow
        run: |
          rm .github/workflows/fix-invalid-jsonld.yml
          git config user.name "IZEM Deployment Repair"
          git config user.email "repair@youraicoach.life"
          git add public/blog/ai-workout-generator-beginners.html .github/workflows/fix-invalid-jsonld.yml
          git commit -m "fix: repair invalid beginner article JSON-LD"
          git push origin HEAD:main

      - name: Start a clean Pages deployment from repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
