name: Content Freshness Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit freshness without changing dates or content
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const blog = path.resolve('public/blog');
          const files = fs.readdirSync(blog)
            .filter((file) => file.endsWith('.html') && file !== 'index.html')
            .map((file) => path.join(blog, file));
          const now = Date.now();
          const rows = [];
          const invalid = [];

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const published = html.match(/"datePublished"\s*:\s*"([^"]+)"/)?.[1] || '';
            const modified = html.match(/"dateModified"\s*:\s*"([^"]+)"/)?.[1] || published;
            const time = Date.parse(modified);
            if (!modified || Number.isNaN(time)) {
              invalid.push(path.relative('.', file));
              continue;
            }
            rows.push({
              file: path.relative('.', file),
              published,
              modified,
              ageDays: Math.floor((now - time) / 86400000),
            });
          }

          rows.sort((a, b) => b.ageDays - a.ageDays);
          const stale = rows.filter((row) => row.ageDays >= 180).slice(0, 40);
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (summary) {
            fs.appendFileSync(summary, '### Content freshness audit\n\n');
            fs.appendFileSync(summary, `- Blog pages checked: ${files.length}\n`);
            fs.appendFileSync(summary, `- Invalid or missing dates: ${invalid.length}\n`);
            fs.appendFileSync(summary, `- Pages older than 180 days: ${rows.filter((row) => row.ageDays >= 180).length}\n\n`);
            if (stale.length) {
              fs.appendFileSync(summary, '| Page | Last meaningful modification | Age |\n|---|---:|---:|\n');
              for (const row of stale) fs.appendFileSync(summary, `| ${row.file} | ${row.modified} | ${row.ageDays} days |\n`);
            }
          }

          if (invalid.length) {
            console.error(`Invalid date metadata in ${invalid.length} files.`);
            for (const file of invalid.slice(0, 20)) console.error(file);
            process.exit(1);
          }
          console.log(`Audited ${files.length} pages without modifying dateModified or content.`);
          NODE

      - name: Prove the audit is read-only
        run: |
          if ! git diff --quiet; then
            echo "::error::Freshness audit modified repository files"
            git diff --name-only
            exit 1
          fi
