name: Live SEO cleanup verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-marketing/verify-live-cleanup.mjs'
      - '.github/workflows/live-seo-cleanup-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the deployed website, sitemaps, quarantines, and YouTube cleanup
        run: node tools/ai-marketing/verify-live-cleanup.mjs
