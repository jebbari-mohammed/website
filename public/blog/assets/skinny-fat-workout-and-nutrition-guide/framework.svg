<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Should You Recomp at Maintenance, Cut Slightly, or Lean Bulk?">
  <rect width="1200" height="630" fill="#070A0D"/>
  <rect x="32" y="32" width="1136" height="566" rx="24" fill="#0B100E" stroke="#26322A" stroke-width="2"/>
  <text x="64" y="96" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="2">IZEM TRAINING REFERENCE · OBJECTS-ONLY DIAGRAM</text>
  <text x="64" y="142" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">Should You Recomp at Maintenance, Cut Slightly, or Lean Bulk?</text>
  <text x="64" y="176" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="18">3-Scenario Decision Matrix Based on Waist-to-Height Ratio &amp; Body Fat</text>
  
  <rect x="64" y="210" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="228" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="255" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">SCENARIO A</text>
  <text x="300" y="246" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Normal Weight · Soft Midsection (15–20% M / 24–29% F)</text>
  <text x="300" y="270" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Eat at TDEE maintenance + 1.8–2.2 g/kg protein. Lift 3–4 days/week.</text>
  <rect x="64" y="306" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="324" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="351" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">SCENARIO B</text>
  <text x="300" y="342" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Higher Belly Fat (20–25%+ M / 30%+ F · Waist > 0.50 Height)</text>
  <text x="300" y="366" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Run a mild 10–15% calorie deficit (-250 to -400 kcal) while lifting progressively.</text>
  <rect x="64" y="402" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="420" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="447" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">SCENARIO C</text>
  <text x="300" y="438" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Underweight Frame · Narrow Shoulders (<15% M / <23% F)</text>
  <text x="300" y="462" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Eat a controlled +150 to +250 kcal surplus to build upper-back, chest, and leg mass.</text>
  
  <rect x="64" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="184" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Scenario A: True Recomp</text>
  <rect x="324" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="444" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Scenario B: Slight Cut (-12%)</text>
  <rect x="584" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="704" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Scenario C: Lean Surplus (+200 kcal)</text>
</svg>
