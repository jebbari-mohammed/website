<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Repeat the setup, then compare the workout</title><desc id="desc">Object-only training notebook with equipment settings and repetitions.</desc><rect width="1200" height="675" rx="28" fill="#103c30"/><circle cx="1110" cy="65" r="220" fill="#b4d762" opacity=".1"/><g font-family="Arial,sans-serif"><text x="60" y="95" font-size="23" fill="#b4d762">A SIMPLE SESSION YOU CAN REPEAT</text><text x="60" y="180" font-size="56" font-weight="700" fill="#f6f8ed">Write down the setup.</text><text x="60" y="250" font-size="56" font-weight="700" fill="#f6f8ed">Then count the reps.</text><rect x="60" y="300" width="1080" height="255" rx="18" fill="#f6f8ed"/><g font-size="26" fill="#163d30"><text x="100" y="355">ANCHOR</text><text x="450" y="355">STRAP SETTING</text><text x="820" y="355">FOOT POSITION</text></g><path d="M100 385h270M450 385h275M820 385h270" stroke="#9daa94" stroke-width="2"/><g font-size="26" fill="#163d30"><text x="100" y="435">Same equipment</text><text x="450" y="435">Same length</text><text x="820" y="435">Repeatable stance</text></g><text x="100" y="510" font-size="24" fill="#53684e">Also record: repetitions, range of motion and effort.</text><text x="60" y="625" font-size="20" fill="#b4d762">IZEM · TRX WORKOUT NOTES</text></g></svg>