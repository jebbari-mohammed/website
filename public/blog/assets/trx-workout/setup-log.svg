<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Compare like with like</title><desc id="desc">Hypothetical notes compare row repetitions using the same setup and an easier setup.</desc><rect width="1200" height="675" rx="28" fill="#103c30"/><circle cx="1110" cy="65" r="220" fill="#b4d762" opacity=".1"/><g font-family="Arial,sans-serif"><text x="60" y="90" font-size="23" fill="#b4d762">HYPOTHETICAL ROW EXAMPLE</text><text x="60" y="165" font-size="50" font-weight="700" fill="#f6f8ed">More reps need some context.</text><rect x="60" y="215" width="520" height="320" rx="18" fill="#f6f8ed"/><rect x="610" y="215" width="530" height="320" rx="18" fill="#e4edce"/><g fill="#163d30"><text x="95" y="275" font-size="25" font-weight="700">SAME SETUP</text><text x="645" y="275" font-size="25" font-weight="700">EASIER ANGLE</text><text x="95" y="370" font-size="64" font-weight="700">10 to 12 reps</text><text x="645" y="370" font-size="64" font-weight="700">10 to 14 reps</text><text x="95" y="435" font-size="23">Same strap and foot position</text><text x="645" y="435" font-size="23">More upright on the second visit</text><text x="95" y="490" font-size="23">A more comparable result</text><text x="645" y="490" font-size="23">Changed difficulty; log both</text></g><text x="60" y="625" font-size="20" fill="#b4d762">IZEM · TRX WORKOUT NOTES</text></g></svg>