<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>Two training windows in one day</title><rect width="1200" height="675" rx="28" fill="#102b22"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="24" fill="#b6d8c5">IZEM / TRAINING SCHEDULE</text><text x="70" y="162" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#f4f8ee">Protect the session that matters most</text><rect x="70" y="236" width="420" height="300" rx="22" fill="#edf3e6"/><rect x="710" y="236" width="420" height="300" rx="22" fill="#edf3e6"/><text x="110" y="299" font-family="Arial,sans-serif" font-size="27" fill="#175c3b">FIRST SESSION</text><text x="110" y="354" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172620">Your main goal</text><rect x="160" y="438" width="240" height="18" rx="7" fill="#175c3b"/><rect x="155" y="403" width="28" height="88" rx="7" fill="#175c3b"/><rect x="377" y="403" width="28" height="88" rx="7" fill="#175c3b"/><text x="750" y="299" font-family="Arial,sans-serif" font-size="27" fill="#175c3b">SECOND SESSION</text><text x="750" y="354" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172620">Adjust as needed</text><rect x="776" y="432" width="33" height="60" rx="6" fill="#175c3b"/><rect x="828" y="402" width="33" height="90" rx="6" fill="#92bd86"/><rect x="880" y="432" width="33" height="60" rx="6" fill="#175c3b"/><rect x="932" y="402" width="33" height="90" rx="6" fill="#92bd86"/><path d="M520 386H675M655 369L675 386L655 403" fill="none" stroke="#b6d8c5" stroke-width="5"/><text x="537" y="432" font-family="Arial,sans-serif" font-size="20" fill="#b6d8c5">Recovery</text><text x="70" y="608" font-family="Arial,sans-serif" font-size="24" fill="#b6d8c5">A scheduling example. No universal recovery interval.</text></svg>