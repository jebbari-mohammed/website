<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Check the proposed plan against the brief</title><desc id="desc">A hypothetical brief specifies Monday and Friday, 35 minutes and dumbbells. Four sessions and cable equipment in a proposed plan are flagged for revision.</desc>
<rect width="1200" height="675" fill="#101813"/><g font-family="Arial,sans-serif"><text x="68" y="76" fill="#c7e58a" font-size="19" letter-spacing="3">IZEM / PLAN CHECK</text><text x="68" y="150" fill="#f2f3e9" font-size="46" font-weight="700">Does the plan fit the brief?</text><text x="68" y="198" fill="#b7c3b9" font-size="21">Hypothetical example: fix visible input mismatches before training.</text>
<rect x="68" y="244" width="485" height="284" rx="8" fill="#f1f0df"/><text x="98" y="294" fill="#253326" font-size="24" font-weight="700">BRIEF</text><g fill="#334434" font-size="25"><text x="98" y="357">Monday and Friday</text><text x="98" y="416">35 minutes, including warm-up</text><text x="98" y="475">Dumbbells; no bench or cables</text></g>
<rect x="598" y="244" width="534" height="284" rx="8" fill="#263525" stroke="#65765b" stroke-width="2"/><text x="628" y="294" fill="#f2f3e9" font-size="24" font-weight="700">PROPOSED PLAN</text><g fill="#e8b17c" font-size="25"><text x="628" y="357">Four weekly sessions</text><text x="628" y="475">Barbell squat and cable row</text></g><text x="628" y="416" fill="#ced7c6" font-size="25">No session-time estimate</text><path d="M628 369h402M628 487h422" stroke="#e8b17c" stroke-width="2"/>
<text x="68" y="592" fill="#c7e58a" font-size="25" font-weight="700">Ask for a revision using your actual constraints.</text><text x="68" y="632" fill="#b7c3b9" font-size="20">This check doesn't assess workload, technique or medical suitability.</text></g></svg>
