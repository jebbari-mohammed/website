<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Start with a useful training brief</title><desc id="desc">A paper training brief, a calendar with Monday and Friday marked and a dumbbell represent the inputs for an AI personal trainer.</desc>
<rect width="1200" height="675" fill="#101813"/><g font-family="Arial,sans-serif"><text x="68" y="76" fill="#c7e58a" font-size="19" letter-spacing="3">IZEM / FIRST WORKOUT</text><text x="68" y="153" fill="#f2f3e9" font-size="48" font-weight="700">Give it your actual week.</text>
<rect x="68" y="207" width="570" height="394" rx="8" fill="#f1f0df"/><text x="100" y="260" fill="#253326" font-size="25" font-weight="700">MY TRAINING BRIEF</text><g fill="#334434" font-size="23"><text x="100" y="320">Goal</text><text x="100" y="376">Days and session time</text><text x="100" y="432">Equipment and weights</text><text x="100" y="488">Recent training</text><text x="100" y="544">Questions for the coach</text></g><g stroke="#819071" stroke-width="2"><path d="M100 335h500M100 391h500M100 447h500M100 503h500M100 559h500"/></g>
<rect x="690" y="208" width="440" height="230" rx="8" fill="#263525" stroke="#65765b" stroke-width="2"/><text x="720" y="257" fill="#f2f3e9" font-size="24" font-weight="700">AVAILABLE DAYS</text><g fill="#b4c3ac" font-size="20"><text x="728" y="310">M</text><text x="786" y="310">T</text><text x="844" y="310">W</text><text x="909" y="310">T</text><text x="970" y="310">F</text><text x="1030" y="310">S</text><text x="1088" y="310">S</text></g><g fill="#c7e58a"><rect x="719" y="330" width="39" height="44" rx="4"/><rect x="959" y="330" width="39" height="44" rx="4"/></g><text x="720" y="407" fill="#cad4c4" font-size="18">An example, not a training prescription</text>
<g fill="#718666"><rect x="760" y="489" width="56" height="110" rx="10"/><rect x="997" y="489" width="56" height="110" rx="10"/><rect x="806" y="531" width="204" height="24" rx="5"/></g><text x="849" y="624" fill="#c7e58a" font-size="18">Use what you have.</text></g></svg>
