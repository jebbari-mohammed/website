<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="svg-title svg-description" data-owner-visual-policy="objects-only-v1"><title id="svg-title">Compare a missed Friday in two schedules</title><desc id="svg-description">Four-day upper/lower calendar loses Friday&#x27;s upper session while the three-day calendar stays unchanged</desc><rect x="0" y="0" width="1200" height="675" rx="0" fill="#09170f" stroke="none"/><text x="66" y="78" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#b4ed80">THE MISSED-DAY CHECK</text><text x="66" y="141" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f2f7ee">What happens when Friday disappears?</text><rect x="66" y="190" width="503" height="382" rx="16" fill="#132b1e" stroke="#3c5e46"/><text x="89" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#edf7e7">4-day upper/lower</text><rect x="88" y="270" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="102" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">MON</text><text x="180" y="302" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Upper A</text><rect x="88" y="327" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="102" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">WED</text><text x="180" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Lower A</text><rect x="88" y="384" width="459" height="47" rx="12" fill="#382b1f" stroke="none"/><text x="102" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">FRI</text><text x="180" y="416" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Upper B</text><text x="356" y="415" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#efd1a6">MISSED</text><rect x="88" y="441" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="102" y="472" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">SAT</text><text x="180" y="473" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Lower B</text><text x="89" y="550" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#c9ddce">Upper visits: 2 → 1. Lower visits: 2.</text><rect x="630" y="190" width="503" height="382" rx="16" fill="#132b1e" stroke="#3c5e46"/><text x="653" y="238" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#edf7e7">3-day full body</text><rect x="652" y="270" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="666" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">MON</text><text x="744" y="302" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Full A</text><rect x="652" y="327" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="666" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">WED</text><text x="744" y="359" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Full B</text><rect x="652" y="384" width="459" height="47" rx="12" fill="#382b1f" stroke="none"/><text x="666" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">FRI</text><text x="744" y="416" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">—</text><text x="920" y="415" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#efd1a6">NOT USED</text><rect x="652" y="441" width="459" height="47" rx="12" fill="#1d3a29" stroke="none"/><text x="666" y="472" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d2e1d4">SAT</text><text x="744" y="473" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f2f7ee">Full C</text><text x="653" y="550" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#c9ddce">All three scheduled visits remain.</text><text x="66" y="622" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#acc5b2">This compares scheduled visits, not equal training volume or predicted results.</text></svg>