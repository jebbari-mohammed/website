<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Five-job workout loop</title><desc id="desc">Object-only circular workflow showing plan, perform, record, review and reach-out.</desc>
<rect width="1200" height="675" rx="28" fill="#081019"/>
<text x="70" y="80" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="900" fill="#F8FAFC">THE WORKOUT LOOP</text>
<text x="70" y="116" font-family="Inter,Arial,sans-serif" font-size="20" fill="#AFC0CF">A generated routine is only step one.</text>
<circle cx="600" cy="370" r="190" fill="none" stroke="#24434A" stroke-width="18"/>
<g font-family="Inter,Arial,sans-serif" font-weight="850" text-anchor="middle">
<g transform="translate(600 180)"><circle r="78" fill="#122733" stroke="#70DDD3" stroke-width="4"/><text y="-4" font-size="24" fill="#70DDD3">1. PLAN</text><text y="28" font-size="15" fill="#D8E2E5">Build the week</text></g>
<g transform="translate(785 315)"><circle r="78" fill="#1A231E" stroke="#F0C57A" stroke-width="4"/><text y="-4" font-size="22" fill="#F0C57A">2. PERFORM</text><text y="28" font-size="15" fill="#D8E2E5">Run the session</text></g>
<g transform="translate(715 535)"><circle r="78" fill="#122733" stroke="#86D7FF" stroke-width="4"/><text y="-4" font-size="22" fill="#86D7FF">3. RECORD</text><text y="28" font-size="15" fill="#D8E2E5">Keep real data</text></g>
<g transform="translate(485 535)"><circle r="78" fill="#17221C" stroke="#8DFF6A" stroke-width="4"/><text y="-4" font-size="22" fill="#8DFF6A">4. REVIEW</text><text y="28" font-size="15" fill="#D8E2E5">Compare plan vs reality</text></g>
<g transform="translate(415 315)"><circle r="78" fill="#221D17" stroke="#FFD36E" stroke-width="4"/><text y="-4" font-size="20" fill="#FFD36E">5. REACH OUT</text><text y="28" font-size="15" fill="#D8E2E5">Create accountability</text></g>
</g>
<path d="M665 205l39 28-47 12M810 386l-8 47-34-35M640 551l-46 13 23-42M439 476l-31-37 49-1M417 247l35-33 8 49" fill="none" stroke="#D0E0DF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="535" y="335" width="130" height="70" rx="16" fill="#0F1D25" stroke="#425D67" stroke-width="2"/>
<text x="600" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">SYSTEM</text><text x="600" y="389" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AFC0CF">What owns the loop?</text>
</svg>