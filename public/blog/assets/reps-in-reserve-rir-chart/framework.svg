<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Which RIR Target Belongs on Each Lift?">
  <rect width="1200" height="630" fill="#070A0D"/>
  <rect x="32" y="32" width="1136" height="566" rx="24" fill="#0B100E" stroke="#26322A" stroke-width="2"/>
  <text x="64" y="96" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="2">IZEM TRAINING REFERENCE · OBJECTS-ONLY DIAGRAM</text>
  <text x="64" y="142" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">Which RIR Target Belongs on Each Lift?</text>
  <text x="64" y="176" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="18">Match proximity to failure to the biomechanical risk and fatigue cost of the exercise</text>
  
  <rect x="64" y="210" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="228" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="255" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">2 TO 3 RIR</text>
  <text x="300" y="246" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Free-Weight Barbell Squats, Deadlifts & Bench Presses</text>
  <text x="300" y="270" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Stops before spinal rounding or bar stall; preserves central nervous system recovery for the rest of the session</text>
  <rect x="64" y="306" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="324" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="351" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">1 TO 2 RIR</text>
  <text x="300" y="342" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Dumbbell Presses, Rows, Split Squats & Leg Presses</text>
  <text x="300" y="366" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">High muscular tension across working sets without sloppy momentum on the final repetition</text>
  <rect x="64" y="402" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="420" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="447" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">0 TO 1 RIR</text>
  <text x="300" y="438" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Cables, Leg Extensions, Leg Curls, Biceps & Delts</text>
  <text x="300" y="462" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Low systemic fatigue and safe failure mechanics make final-set 0-1 RIR practical here</text>
  
  <rect x="64" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="184" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Technical vs Absolute Failure</text>
  <rect x="324" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="444" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Bar-Speed Check</text>
  <rect x="584" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="704" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">4-Week RIR Ramp</text>
  <rect x="844" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="964" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">IZEM Load Tools</text>
</svg>
