<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Incline Dumbbell Press Angle Guide (15° to 30°)">
  <rect width="1200" height="630" fill="#070A0D"/>
  <rect x="32" y="32" width="1136" height="566" rx="24" fill="#0B100E" stroke="#26322A" stroke-width="2"/>
  <text x="64" y="96" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="2">IZEM TRAINING REFERENCE · OBJECTS-ONLY DIAGRAM</text>
  <text x="64" y="142" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">Incline Dumbbell Press Angle Guide (15° to 30°)</text>
  <text x="64" y="176" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="18">Clavicular Pectoralis vs. Anterior Deltoid Activation Across Bench Angles</text>
  
  <rect x="64" y="210" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="228" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="255" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">15° TO 30°</text>
  <text x="300" y="246" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Sweet Spot for Upper Chest (Clavicular Head)</text>
  <text x="300" y="270" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Maximizes upper pec fiber alignment before anterior deltoid torque dominates.</text>
  <rect x="64" y="306" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="324" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="351" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">0° FLAT BENCH</text>
  <text x="300" y="342" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Maximum Sternal Pectoralis & Total Load</text>
  <text x="300" y="366" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Best for overall chest mass and load capacity, lower upper-pec bias.</text>
  <rect x="64" y="402" width="1072" height="78" rx="12" fill="#111714" stroke="#26322A" stroke-width="2"/>
  <rect x="84" y="420" width="190" height="42" rx="8" fill="#18211B" stroke="#8DFF6A" stroke-width="1.5"/>
  <text x="179" y="447" text-anchor="middle" fill="#8DFF6A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">45° TO 60°</text>
  <text x="300" y="438" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Steep Decline in Upper Pec · Sharp Anterior Delt Spike</text>
  <text x="300" y="462" fill="#A1A1A1" font-family="system-ui, -apple-system, sans-serif" font-size="15">Most fixed gym incline benches are 45°—often too steep for pure chest work.</text>
  
  <rect x="64" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="184" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">15° Low Incline (Notch 1)</text>
  <rect x="324" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="444" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">30° Peak Upper Chest (Notch 2)</text>
  <rect x="584" y="530" width="240" height="44" rx="22" fill="#18211B" stroke="#26322A" stroke-width="1.5"/>
  <text x="704" y="558" text-anchor="middle" fill="#D8FF86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">45°+ Deltoid Takeover</text>
</svg>
