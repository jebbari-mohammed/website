<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Record both working legs</title><desc id="desc">Example log with two paired sets. Each set records eight left-leg and eight right-leg repetitions, totaling 32 across both legs. This is an illustration, not a prescription.</desc>
<rect width="1200" height="675" fill="#0d1b12"/><g font-family="Arial, sans-serif"><text x="80" y="94" fill="#b4ed80" font-size="17" letter-spacing="2">IZEM · TRAINING RECORD</text><text x="80" y="162" fill="#edf4e9" font-size="44" font-weight="700">Write down both sides</text><text x="80" y="204" fill="#b4c9bb" font-size="22">Example only: two sets of eight per leg</text>
<rect x="80" y="260" width="1040" height="269" rx="14" fill="#172e20" stroke="#4e6950"/><path d="M80 340H1120M80 432H1120M570 260V529M845 260V529" stroke="#4e6950" stroke-width="2"/>
<g fill="#b4c9bb" font-size="22"><text x="110" y="310">PAIRED SET</text><text x="599" y="310">LEFT LEG</text><text x="873" y="310">RIGHT LEG</text></g><g fill="#edf4e9" font-size="31"><text x="110" y="397">1</text><text x="599" y="397">8 reps</text><text x="873" y="397">8 reps</text><text x="110" y="492">2</text><text x="599" y="492">8 reps</text><text x="873" y="492">8 reps</text></g>
<text x="80" y="586" fill="#b4ed80" font-size="27" font-weight="700">2 sets for each leg · 32 repetitions altogether</text><text x="80" y="626" fill="#b4c9bb" font-size="18">Also record the load, setup changes and rest you actually took.</text></g></svg>
