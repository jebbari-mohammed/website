<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Example workout sequence around 12-hour nursing shifts</title>
<desc id="desc">Object-only weekly rota example showing night shifts, recovery, strength sessions and a short fallback workout. No people are shown.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101C"/><stop offset="1" stop-color="#102A2A"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="70" y="88" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#9CE8DC">EXAMPLE, NOT A PRESCRIPTION</text>
<text x="70" y="142" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="850" fill="#F8FAFC">A week can move without falling apart.</text>
<text x="70" y="181" font-family="Inter,Arial,sans-serif" font-size="19" fill="#B8C7D9">The session order stays useful even when the rota changes.</text>
<g transform="translate(70 245)">
  <g><rect width="140" height="250" rx="20" fill="#14283A" stroke="#29465E" stroke-width="2"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 1</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="900" fill="#00D4FF">NIGHT</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">12h shift</text><circle cx="70" cy="164" r="25" fill="#0D1827" stroke="#40566C" stroke-width="2"/><path d="M70 150v15l10 7" fill="none" stroke="#AEBBCC" stroke-width="4" stroke-linecap="round"/><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#AEBBCC">NO FORCED GYM</text></g>
  <g transform="translate(150)"><rect width="140" height="250" rx="20" fill="#14283A" stroke="#29465E" stroke-width="2"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 2</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="900" fill="#00D4FF">NIGHT</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">12h shift</text><rect x="38" y="146" width="64" height="48" rx="12" fill="#0D1827"/><text x="70" y="176" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#AEBBCC">MOVE</text><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#AEBBCC">IF NEEDED</text></g>
  <g transform="translate(300)"><rect width="140" height="250" rx="20" fill="#102D2A" stroke="#24534B" stroke-width="2"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 3</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#8DFF6A">RECOVER</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">reset window</text><circle cx="70" cy="166" r="25" fill="#173C3A"/><path d="M56 166h28M70 152v28" stroke="#9CE8DC" stroke-width="4" stroke-linecap="round"/><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#9CE8DC">WALK / MOBILITY</text></g>
  <g transform="translate(450)"><rect width="140" height="250" rx="20" fill="#102D2A" stroke="#42C7C3" stroke-width="3"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 4</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#F8FAFC">STRENGTH A</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">main session</text><g transform="translate(30 145)" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"><line x1="0" y1="25" x2="80" y2="25"/><line x1="0" y1="10" x2="0" y2="40"/><line x1="16" y1="5" x2="16" y2="45"/><line x1="64" y1="5" x2="64" y2="45"/><line x1="80" y1="10" x2="80" y2="40"/></g><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#8DFF6A">45–50 MIN</text></g>
  <g transform="translate(600)"><rect width="140" height="250" rx="20" fill="#14283A" stroke="#29465E" stroke-width="2"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 5</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#FFD166">SHORT</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">fallback option</text><rect x="28" y="146" width="84" height="49" rx="12" fill="#182235"/><text x="70" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="900" fill="#FFD166">20 MIN</text><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#AEBBCC">OR REST</text></g>
  <g transform="translate(750)"><rect width="140" height="250" rx="20" fill="#102D2A" stroke="#42C7C3" stroke-width="3"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 6</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#F8FAFC">STRENGTH B</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">next priority</text><g transform="translate(30 145)" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"><line x1="0" y1="25" x2="80" y2="25"/><line x1="0" y1="10" x2="0" y2="40"/><line x1="16" y1="5" x2="16" y2="45"/><line x1="64" y1="5" x2="64" y2="45"/><line x1="80" y1="10" x2="80" y2="40"/></g><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#8DFF6A">35–50 MIN</text></g>
  <g transform="translate(900)"><rect width="140" height="250" rx="20" fill="#102D2A" stroke="#24534B" stroke-width="2"/><text x="70" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#B8C7D9">DAY 7</text><text x="70" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#8DFF6A">OPEN</text><text x="70" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#AEBBCC">next rota starts</text><rect x="32" y="146" width="76" height="50" rx="12" fill="#173C3A"/><path d="M49 171h42" stroke="#9CE8DC" stroke-width="5" stroke-linecap="round"/><path d="M78 159l13 12-13 12" fill="none" stroke="#9CE8DC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#9CE8DC">CONTINUE</text></g>
</g>
<rect x="70" y="545" width="1040" height="68" rx="18" fill="#101B2A" stroke="#31465A"/>
<text x="590" y="575" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">The goal is not a perfect calendar.</text><text x="590" y="601" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#B8C7D9">It is a repeatable sequence that survives schedule changes.</text>
</svg>
