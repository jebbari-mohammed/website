<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Shift-proof workout decision framework</title>
<desc id="desc">Object-only decision diagram showing recovery, available time and training priority as three cards. No people are shown.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101C"/><stop offset="1" stop-color="#123129"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="70" y="90" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#9CE8DC">THE 3-GATE RULE</text>
<text x="70" y="145" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="850" fill="#F8FAFC">Pick the session after the shift is known.</text>
<text x="70" y="185" font-family="Inter,Arial,sans-serif" font-size="19" fill="#B8C7D9">Use sequence and readiness instead of forcing Monday / Wednesday / Friday.</text>
<g transform="translate(70 245)" filter="url(#s)">
  <rect width="310" height="280" rx="24" fill="#101B2A" stroke="#31465A" stroke-width="3"/>
  <circle cx="50" cy="52" r="25" fill="#173C3A"/><text x="50" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#9CE8DC">1</text>
  <text x="32" y="112" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" fill="#F8FAFC">Recovery gate</text>
  <text x="32" y="154" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">Do you feel ready for</text><text x="32" y="180" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">a real training session?</text>
  <rect x="32" y="218" width="220" height="12" rx="6" fill="#AEBBCC" opacity=".48"/><rect x="32" y="244" width="150" height="12" rx="6" fill="#AEBBCC" opacity=".28"/>
</g>
<path d="M394 385 H430" stroke="#8DFF6A" stroke-width="7" stroke-linecap="round"/><path d="M419 373l13 12-13 12" fill="none" stroke="#8DFF6A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(445 245)" filter="url(#s)">
  <rect width="310" height="280" rx="24" fill="#101B2A" stroke="#42C7C3" stroke-width="3"/>
  <circle cx="50" cy="52" r="25" fill="#42C7C3"/><text x="50" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#041515">2</text>
  <text x="32" y="112" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" fill="#F8FAFC">Time gate</text>
  <text x="32" y="154" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">Do you have 20, 35,</text><text x="32" y="180" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">or 50 useful minutes?</text>
  <g transform="translate(32 216)"><circle cx="20" cy="20" r="17" fill="#173C3A"/><path d="M20 10v11l8 5" fill="none" stroke="#8DFF6A" stroke-width="4" stroke-linecap="round"/><rect x="56" y="10" width="154" height="13" rx="6" fill="#AEBBCC" opacity=".48"/><rect x="56" y="36" width="108" height="13" rx="6" fill="#AEBBCC" opacity=".28"/></g>
</g>
<path d="M769 385 H805" stroke="#8DFF6A" stroke-width="7" stroke-linecap="round"/><path d="M794 373l13 12-13 12" fill="none" stroke="#8DFF6A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(820 245)" filter="url(#s)">
  <rect width="310" height="280" rx="24" fill="#101B2A" stroke="#31465A" stroke-width="3"/>
  <circle cx="50" cy="52" r="25" fill="#173C3A"/><text x="50" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#9CE8DC">3</text>
  <text x="32" y="112" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" fill="#F8FAFC">Priority gate</text>
  <text x="32" y="154" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">Choose the highest-value</text><text x="32" y="180" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B8C7D9">session you can finish.</text>
  <g transform="translate(34 215)" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"><line x1="0" y1="28" x2="180" y2="28"/><line x1="0" y1="10" x2="0" y2="46"/><line x1="24" y1="4" x2="24" y2="52"/><line x1="156" y1="4" x2="156" y2="52"/><line x1="180" y1="10" x2="180" y2="46"/></g>
</g>
<rect x="70" y="565" width="1060" height="54" rx="16" fill="#102D2A" stroke="#24534B"/>
<text x="600" y="599" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#DDFDE5">If a gate fails, shorten, move, or skip the session — do not restart the whole week.</text>
</svg>
