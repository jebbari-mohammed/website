<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">SWITCH framework for choosing a fitness coaching app</title>
<desc id="desc">Object-only decision framework with six cards for support, wait tolerance, integration, training adaptation, coaching medium, and human need. No people are shown.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060B1D"/><stop offset="1" stop-color="#10261F"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/>
<text x="70" y="80" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="900" fill="#8DFF6A" letter-spacing="3">SWITCH TEST</text>
<text x="70" y="132" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="900" fill="#F8FAFC">Six questions before you switch fitness apps</text>
<text x="70" y="169" font-family="Inter,Arial,sans-serif" font-size="20" fill="#AFC0D1">Score the coaching workflow you need — not the length of the feature list.</text>
<g font-family="Inter,Arial,sans-serif" filter="url(#s)">
  <g transform="translate(70 225)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#86D7FF" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#86D7FF" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#86D7FF">S</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">SUPPORT MODEL</text><text x="28" y="91" font-size="15" fill="#B9C7D2">Human coach, AI coach,</text><text x="28" y="116" font-size="15" fill="#B9C7D2">or self-directed tracker?</text></g>
  <g transform="translate(435 225)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#FFD36E" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#FFD36E" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#FFD36E">W</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">WAIT TOLERANCE</text><text x="28" y="91" font-size="15" fill="#B9C7D2">Message-and-wait, or</text><text x="28" y="116" font-size="15" fill="#B9C7D2">instant software response?</text></g>
  <g transform="translate(800 225)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#8DFF6A" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#8DFF6A" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#8DFF6A">I</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">INTEGRATION</text><text x="28" y="91" font-size="15" fill="#B9C7D2">Workouts, meals, progress</text><text x="28" y="116" font-size="15" fill="#B9C7D2">and accountability together?</text></g>
  <g transform="translate(70 410)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#8DFF6A" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#8DFF6A" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#8DFF6A">T</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">TRAINING ADAPTATION</text><text x="28" y="91" font-size="15" fill="#B9C7D2">What happens when schedule,</text><text x="28" y="116" font-size="15" fill="#B9C7D2">equipment or recovery changes?</text></g>
  <g transform="translate(435 410)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#86D7FF" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#86D7FF" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#86D7FF">C</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">COACHING MEDIUM</text><text x="28" y="91" font-size="15" fill="#B9C7D2">Text, voice, reminders,</text><text x="28" y="116" font-size="15" fill="#B9C7D2">community, or self-tracking?</text></g>
  <g transform="translate(800 410)"><rect width="330" height="150" rx="20" fill="#0D1A27" stroke="#C9A84C" stroke-width="2"/><circle cx="45" cy="44" r="23" fill="#C9A84C" opacity=".16"/><text x="45" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#FFD36E">H</text><text x="82" y="47" font-size="18" font-weight="900" fill="#F8FAFC">HUMAN NEED</text><text x="28" y="91" font-size="15" fill="#B9C7D2">Do you specifically need</text><text x="28" y="116" font-size="15" fill="#B9C7D2">human judgment or form review?</text></g>
</g>
<path d="M70 607H1130" stroke="#2F4658" stroke-width="2"/><text x="70" y="640" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850" fill="#8DFF6A" letter-spacing="2">IZEM · SWITCH FRAMEWORK</text>
</svg>