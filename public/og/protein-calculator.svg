<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Protein calculator target map</title>
  <desc id="desc">Object-only protein target map with meal cards, calculator numbers, and weekly review loop.</desc>
  <rect width="1200" height="630" fill="#07110f"/>
  <path d="M0 0h1200v630H0z" fill="#07110f"/>
  <circle cx="1010" cy="96" r="170" fill="#68e0be" opacity=".11"/>
  <circle cx="166" cy="560" r="210" fill="#7c5cfc" opacity=".11"/>
  <rect x="84" y="72" width="1032" height="486" rx="28" fill="#0b1915" stroke="#22483c" stroke-width="2"/>
  <text x="130" y="150" fill="#68e0be" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">IZEM PROTEIN CALCULATOR</text>
  <text x="130" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">Range first.</text>
  <text x="130" y="286" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">Meals second.</text>
  <text x="132" y="340" fill="#b8c7c1" font-family="Inter, Arial, sans-serif" font-size="26">Daily target, meal split, and weekly review</text>
  <g transform="translate(130 400)">
    <rect width="230" height="92" rx="16" fill="#10201b" stroke="#2e5f50"/>
    <text x="24" y="38" fill="#68e0be" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">DAILY RANGE</text>
    <text x="24" y="70" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">120-150g</text>
  </g>
  <g transform="translate(390 400)">
    <rect width="230" height="92" rx="16" fill="#10201b" stroke="#2e5f50"/>
    <text x="24" y="38" fill="#68e0be" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">PER MEAL</text>
    <text x="24" y="70" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">30-38g</text>
  </g>
  <g transform="translate(650 400)">
    <rect width="300" height="92" rx="16" fill="#10201b" stroke="#2e5f50"/>
    <text x="24" y="38" fill="#68e0be" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">WEEKLY REVIEW</text>
    <text x="24" y="70" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">Adjust calmly</text>
  </g>
  <g transform="translate(784 118)">
    <rect width="246" height="198" rx="28" fill="#122720" stroke="#68e0be" stroke-opacity=".5"/>
    <rect x="38" y="42" width="170" height="28" rx="14" fill="#68e0be" opacity=".28"/>
    <rect x="38" y="90" width="92" height="28" rx="14" fill="#f0a45c" opacity=".8"/>
    <rect x="142" y="90" width="66" height="28" rx="14" fill="#68e0be" opacity=".8"/>
    <rect x="38" y="138" width="170" height="28" rx="14" fill="#7c5cfc" opacity=".7"/>
  </g>
</svg>
