<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Workout Accountability Call Script</title>
  <desc id="desc">IZEM workout accountability call script with plan, blocker, branch, action, and review steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F12"/>
      <stop offset="0.58" stop-color="#10251F"/>
      <stop offset="1" stop-color="#2A1D13"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="444" x2="1080" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42C7C3"/>
      <stop offset="0.48" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF6F5E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M80 104H1120" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <path d="M80 526H1120" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="86" y="76" fill="#FCD34D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2">IZEM ACCOUNTABILITY CALLS</text>
  <text x="86" y="176" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="850">Workout accountability</text>
  <text x="86" y="248" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="850">call script</text>
  <text x="86" y="310" fill="#D0DBD6" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="650">A 3-minute template for the pre-workout decision</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="86" y="374" width="184" height="104" rx="8" fill="#101816" stroke="#42C7C3" stroke-opacity="0.58"/>
    <text x="112" y="418" fill="#42C7C3" font-size="23" font-weight="850">PLAN</text>
    <text x="112" y="452" fill="#AEBBB5" font-size="17">Name the session</text>
    <rect x="298" y="374" width="184" height="104" rx="8" fill="#101816" stroke="#F59E0B" stroke-opacity="0.62"/>
    <text x="324" y="418" fill="#F59E0B" font-size="23" font-weight="850">BLOCKER</text>
    <text x="324" y="452" fill="#AEBBB5" font-size="17">Say what changed</text>
    <rect x="510" y="374" width="184" height="104" rx="8" fill="#101816" stroke="#EF6F5E" stroke-opacity="0.62"/>
    <text x="536" y="418" fill="#FCA5A5" font-size="23" font-weight="850">BRANCH</text>
    <text x="536" y="452" fill="#AEBBB5" font-size="17">Full or fallback</text>
    <rect x="722" y="374" width="184" height="104" rx="8" fill="#101816" stroke="#A3E635" stroke-opacity="0.54"/>
    <text x="748" y="418" fill="#BEF264" font-size="23" font-weight="850">ACTION</text>
    <text x="748" y="452" fill="#AEBBB5" font-size="17">Start before hangup</text>
    <rect x="934" y="374" width="184" height="104" rx="8" fill="#101816" stroke="#8B5CF6" stroke-opacity="0.56"/>
    <text x="960" y="418" fill="#C4B5FD" font-size="23" font-weight="850">REVIEW</text>
    <text x="960" y="452" fill="#AEBBB5" font-size="17">Adapt next week</text>
  </g>
  <path d="M270 426H298M482 426H510M694 426H722M906 426H934" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <text x="86" y="572" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750">youraicoach.life</text>
  <text x="1120" y="572" text-anchor="end" fill="#9DACA5" font-family="Inter, Arial, sans-serif" font-size="20">Proactive AI personal trainer</text>
</svg>
