<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Can't Add Weight? Progressive Overload Missed-Target Guide</title>
  <desc id="desc">IZEM missed-target ladder showing repeat, reduce, reroute, and review decisions for progressive overload.</desc>
  <defs>
    <linearGradient id="bg" x1="66" y1="46" x2="1130" y2="594" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#202414"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="470" x2="980" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68E2C5"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="blur" x="-120" y="-120" width="1440" height="870" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="78"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="190" cy="112" r="170" fill="#68E2C5" fill-opacity="0.14" filter="url(#blur)"/>
  <circle cx="1020" cy="540" r="190" fill="#F59E0B" fill-opacity="0.12" filter="url(#blur)"/>
  <rect x="70" y="65" width="1060" height="500" rx="28" fill="#10171D" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="120" y="132" fill="#AEBCC4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">IZEM</text>
  <text x="120" y="205" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="850">Can't add weight?</text>
  <text x="120" y="264" fill="#D8E5E2" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Use the missed-target ladder</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="120" y="330" width="220" height="112" rx="18" fill="#0B1117" stroke="#68E2C5" stroke-opacity="0.35"/>
    <text x="150" y="371" fill="#68E2C5" font-size="18" font-weight="800">1 REPEAT</text>
    <text x="150" y="412" fill="#F8FAFC" font-size="23" font-weight="760">Small miss</text>
    <rect x="366" y="330" width="220" height="112" rx="18" fill="#0B1117" stroke="#68E2C5" stroke-opacity="0.35"/>
    <text x="396" y="371" fill="#68E2C5" font-size="18" font-weight="800">2 REDUCE</text>
    <text x="396" y="412" fill="#F8FAFC" font-size="23" font-weight="760">Target too big</text>
    <rect x="612" y="330" width="220" height="112" rx="18" fill="#0B1117" stroke="#F59E0B" stroke-opacity="0.42"/>
    <text x="642" y="371" fill="#F59E0B" font-size="18" font-weight="800">3 REROUTE</text>
    <text x="642" y="412" fill="#F8FAFC" font-size="23" font-weight="760">Change variable</text>
    <rect x="858" y="330" width="220" height="112" rx="18" fill="#0B1117" stroke="#F59E0B" stroke-opacity="0.42"/>
    <text x="888" y="371" fill="#F59E0B" font-size="18" font-weight="800">4 REVIEW</text>
    <text x="888" y="412" fill="#F8FAFC" font-size="23" font-weight="760">Repeated signal</text>
  </g>
  <path d="M166 498 C320 470 454 492 610 462 C742 437 858 392 1010 280" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1010" cy="280" r="10" fill="#F59E0B"/>
  <text x="600" y="542" text-anchor="middle" fill="#B7C4CC" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650">Turn a missed set into a better next-session decision</text>
</svg>
