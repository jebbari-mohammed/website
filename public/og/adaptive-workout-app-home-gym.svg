    <text x="38" y="114" fill="#9fb7ae" font-family="Inter, Arial, sans-serif" font-size="19">Gear first. Plan second. Review next.</text>

    <rect x="38" y="154" width="398" height="56" rx="16" fill="#11241f" stroke="#386257"/>
    <circle cx="70" cy="182" r="12" fill="url(#teal)"/>
    <text x="98" y="190" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Dumbbells + bench</text>

    <rect x="38" y="232" width="398" height="56" rx="16" fill="#11241f" stroke="#386257"/>
    <circle cx="70" cy="260" r="12" fill="url(#amber)"/>
    <text x="98" y="268" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tight floor space</text>

    <rect x="38" y="310" width="398" height="56" rx="16" fill="#11241f" stroke="#386257"/>
    <circle cx="70" cy="338" r="12" fill="url(#teal)"/>
    <text x="98" y="346" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">30-minute fallback</text>

    <rect x="38" y="388" width="398" height="56" rx="16" fill="#11241f" stroke="#386257"/>
    <circle cx="70" cy="416" r="12" fill="url(#amber)"/>
    <text x="98" y="424" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Adapt next week</text>
  </g>

  <g transform="translate(634 76)" filter="url(#shadow)">
    <rect x="0" y="0" width="338" height="452" rx="34" fill="#0a1512" stroke="#28483f" stroke-width="2"/>
    <rect x="122" y="22" width="94" height="9" rx="5" fill="#395e54"/>
    <rect x="34" y="68" width="270" height="84" rx="20" fill="#12241f" stroke="#31584d"/>
    <text x="62" y="104" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">Today's plan</text>
    <text x="62" y="132" fill="#9fb7ae" font-family="Inter, Arial, sans-serif" font-size="15">Home equipment matched</text>

