<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive workout app for home gym equipment</title>
  <desc id="desc">People-free IZEM graphic showing home gym gear, a phone, and an adaptive workout checklist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="1" stop-color="#12251f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e6c8"/>
      <stop offset="1" stop-color="#38c7c9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c47a"/>
      <stop offset="1" stop-color="#f09a48"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 114h1200M0 252h1200M0 390h1200M0 528h1200M184 0v630M416 0v630M648 0v630M880 0v630M1112 0v630" stroke="#1d3a33" stroke-width="1" opacity=".46"/>

  <g transform="translate(74 74)" filter="url(#shadow)">
