      <text x="20" y="22" fill="#c9fbf0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Push</text>
      <rect x="96" y="0" width="76" height="32" rx="16" fill="#2e2a1a" stroke="#f7c47a"/>
      <text x="116" y="22" fill="#ffe4b8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Pull</text>
      <rect x="192" y="0" width="76" height="32" rx="16" fill="#16342d" stroke="#72e6c8"/>
      <text x="207" y="22" fill="#c9fbf0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Hinge</text>
    </g>

    <line x1="54" y1="278" x2="284" y2="278" stroke="#28483f" stroke-width="2"/>
    <line x1="54" y1="332" x2="284" y2="332" stroke="#28483f" stroke-width="2"/>
    <line x1="54" y1="386" x2="284" y2="386" stroke="#28483f" stroke-width="2"/>
    <path d="M72 278l16 16 32-40" fill="none" stroke="#72e6c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 332l16 16 32-40" fill="none" stroke="#72e6c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 386l16 16 32-40" fill="none" stroke="#f7c47a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="285" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="18">Fits the room</text>
    <text x="136" y="339" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="18">Has a fallback</text>
    <text x="136" y="393" fill="#dce9e4" font-family="Inter, Arial, sans-serif" font-size="18">Reviewed later</text>
  </g>

  <g transform="translate(896 472)">
    <rect x="0" y="28" width="196" height="28" rx="14" fill="#243a34"/>
    <rect x="20" y="0" width="36" height="84" rx="11" fill="url(#teal)"/>
    <rect x="140" y="0" width="36" height="84" rx="11" fill="url(#teal)"/>
    <rect x="56" y="30" width="84" height="24" rx="12" fill="#c9fbf0"/>
  </g>

  <g transform="translate(606 520)">
    <rect x="0" y="0" width="156" height="34" rx="17" fill="#2e2a1a" stroke="#f7c47a"/>
    <text x="24" y="23" fill="#ffe4b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Bands</text>
    <rect x="176" y="0" width="156" height="34" rx="17" fill="#16342d" stroke="#72e6c8"/>
    <text x="202" y="23" fill="#c9fbf0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Bench</text>
  </g>

  <text x="74" y="602" fill="#a9bbb4" font-family="Inter, Arial, sans-serif" font-size="18">IZEM adaptive workout planning for real home equipment</text>
</svg>
