  <text x="118" y="222" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="850">Adaptive Workout</text>
  <text x="118" y="292" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="850">and Meal Plan App</text>
