<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Pre-Workout Call Brief</title>
  <desc id="desc">Five tests for a useful workout reminder call: timing, session, first action, fallback, and follow-up.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B1D"/>
      <stop offset="1" stop-color="#101B44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="85" r="220" fill="#00D4FF" opacity=".12" filter="url(#glow)"/>
  <rect width="1200" height="8" fill="url(#accent)"/>

  <text x="64" y="84" fill="#67E8F9" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="750" letter-spacing="3">IZEM PRODUCT-DESIGN FRAMEWORK</text>
  <text x="64" y="166" fill="#F8FAFC" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="850" letter-spacing="-2">The Pre-Workout</text>
  <text x="64" y="234" fill="#F8FAFC" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="850" letter-spacing="-2">Call Brief</text>
  <text x="64" y="285" fill="#AFC1D4" font-family="system-ui,-apple-system,sans-serif" font-size="27">Five tests for a call that creates a useful next step</text>

  <g font-family="system-ui,-apple-system,sans-serif" font-size="23" font-weight="700">
    <rect x="64" y="340" width="198" height="70" rx="18" fill="#0E2740" stroke="#1D7188"/>
    <text x="92" y="384" fill="#E6FAFF">1  TIMING</text>
    <rect x="278" y="340" width="198" height="70" rx="18" fill="#10233F" stroke="#315D8B"/>
    <text x="306" y="384" fill="#E6FAFF">2  SESSION</text>
    <rect x="492" y="340" width="198" height="70" rx="18" fill="#15213F" stroke="#4F578F"/>
    <text x="520" y="384" fill="#E6FAFF">3  START</text>
    <rect x="706" y="340" width="198" height="70" rx="18" fill="#1A2043" stroke="#654E9D"/>
    <text x="734" y="384" fill="#E6FAFF">4  FALLBACK</text>
    <rect x="920" y="340" width="216" height="70" rx="18" fill="#211E46" stroke="#7951B1"/>
    <text x="948" y="384" fill="#E6FAFF">5  FOLLOW-UP</text>
  </g>

  <rect x="64" y="468" width="1072" height="2" fill="url(#accent)" opacity=".65"/>
  <text x="64" y="526" fill="#F8FAFC" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="750">A useful call removes a decision.</text>
  <text x="64" y="567" fill="#94A3B8" font-family="system-ui,-apple-system,sans-serif" font-size="24">If it only repeats the time, it is an expensive ringtone.</text>
  <text x="1136" y="578" fill="#64748B" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="20">youraicoach.life</text>
</svg>
