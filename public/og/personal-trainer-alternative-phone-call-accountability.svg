<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Trainer Alternative App That Calls You - IZEM</title>
  <desc id="desc">People-free IZEM social image showing a coach replacement fit test scorecard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050806"/>
      <stop offset="0.62" stop-color="#0F1D14"/>
      <stop offset="1" stop-color="#102033"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="56" y="56" width="1088" height="518" rx="8" fill="#081019" stroke="#1E3A2B" stroke-width="2"/>
  <text x="92" y="124" fill="#8DFF6A" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">IZEM GUIDE</text>
  <text x="92" y="226" fill="#F5FFF1" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Personal trainer</text>
  <text x="92" y="298" fill="#F5FFF1" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">alternative app</text>
  <text x="92" y="370" fill="#F5FFF1" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">that calls you</text>
  <text x="96" y="430" fill="#A6B6AC" font-family="Arial, Helvetica, sans-serif" font-size="26">Coach Replacement Fit Test</text>
  <g transform="translate(750 150)">
    <rect x="0" y="0" width="330" height="330" rx="8" fill="#102018" stroke="#27583A"/>
    <text x="30" y="54" fill="#C8FFB8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">FIT TEST</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
      <rect x="30" y="86" width="270" height="36" rx="8" fill="#162A20" stroke="#2F6442"/>
      <text x="48" y="111" fill="#F5FFF1">Plan design</text>
      <text x="276" y="111" fill="#8DFF6A" text-anchor="end">1</text>
      <rect x="30" y="136" width="270" height="36" rx="8" fill="#162A20" stroke="#2F6442"/>
      <text x="48" y="161" fill="#F5FFF1">Decision timing</text>
      <text x="276" y="161" fill="#8DFF6A" text-anchor="end">1</text>
      <rect x="30" y="186" width="270" height="36" rx="8" fill="#162A20" stroke="#2F6442"/>
      <text x="48" y="211" fill="#F5FFF1">Fallback</text>
      <text x="276" y="211" fill="#8DFF6A" text-anchor="end">1</text>
      <rect x="30" y="236" width="270" height="36" rx="8" fill="#162A20" stroke="#2F6442"/>
      <text x="48" y="261" fill="#F5FFF1">Review loop</text>
      <text x="276" y="261" fill="#8DFF6A" text-anchor="end">1</text>
    </g>
  </g>
  <rect x="92" y="472" width="410" height="4" rx="2" fill="#42C7C3"/>
  <text x="92" y="535" fill="#8DA094" font-family="Arial, Helvetica, sans-serif" font-size="24">youraicoach.life</text>
  <text x="1108" y="535" fill="#F5FFF1" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="end">IZEM</text>
</svg>
