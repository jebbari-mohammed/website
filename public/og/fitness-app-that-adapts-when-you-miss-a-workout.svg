<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">IZEM Reset Decision Map</title>
  <desc id="desc">Object-only social card for a missed workout reset guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081019"/>
      <stop offset="1" stop-color="#15251f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58D6C7"/>
      <stop offset="1" stop-color="#F0B765"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#bar)"/>
  <rect x="64" y="58" width="238" height="44" rx="8" fill="rgba(88,214,199,.12)" stroke="rgba(88,214,199,.38)"/>
  <text x="84" y="86" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ABF0E7">MISSED WORKOUT</text>

  <text x="64" y="182" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#F8FAFC">Reset the plan.</text>
  <text x="64" y="252" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#F8FAFC">Do not repay it.</text>
  <text x="66" y="310" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#B8C8C4">Skip, shrink, shift, or swap after a missed session.</text>

  <g transform="translate(64 374)">
    <rect x="0" y="0" width="246" height="112" rx="8" fill="#111B1F" stroke="rgba(255,255,255,.13)"/>
    <rect x="20" y="22" width="42" height="42" rx="8" fill="#58D6C7"/>
    <text x="81" y="49" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC">Skip</text>
    <text x="20" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#AFC2BE">Let low-priority work go</text>
  </g>
  <g transform="translate(334 374)">
    <rect x="0" y="0" width="246" height="112" rx="8" fill="#111B1F" stroke="rgba(255,255,255,.13)"/>
    <rect x="20" y="22" width="42" height="42" rx="8" fill="#F0B765"/>
    <text x="81" y="49" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC">Shrink</text>
    <text x="20" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#AFC2BE">Keep the main job</text>
  </g>
  <g transform="translate(604 374)">
    <rect x="0" y="0" width="246" height="112" rx="8" fill="#111B1F" stroke="rgba(255,255,255,.13)"/>
    <rect x="20" y="22" width="42" height="42" rx="8" fill="#7DD3FC"/>
    <text x="81" y="49" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC">Shift</text>
    <text x="20" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#AFC2BE">Move it with recovery room</text>
  </g>
  <g transform="translate(874 374)">
    <rect x="0" y="0" width="246" height="112" rx="8" fill="#111B1F" stroke="rgba(255,255,255,.13)"/>
    <rect x="20" y="22" width="42" height="42" rx="8" fill="#B8F2E6"/>
    <text x="81" y="49" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC">Swap</text>
    <text x="20" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#AFC2BE">Keep the goal intact</text>
  </g>

  <rect x="64" y="548" width="160" height="36" rx="8" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.1)"/>
  <text x="84" y="572" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900" fill="#F8FAFC">IZEM</text>
  <text x="1136" y="573" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#7D9189" text-anchor="end">youraicoach.life</text>
</svg>
