<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Workout Accountability Calendar</title>
  <desc id="desc">Free IZEM monthly workout accountability calendar with planned, completed, missed, and rest-day states.</desc>
