    <linearGradient id="bg" x1="80" y1="30" x2="1120" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#07111E"/><stop offset="1" stop-color="#101A31"/></linearGradient>
    <linearGradient id="accent" x1="260" y1="165" x2="950" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#72E8F3"/><stop offset="0.55" stop-color="#8DFF6A"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
