    <rect x="365" y="322" width="218" height="140" rx="22" fill="#101C35" stroke="#43D7C6" stroke-opacity=".55"/><text x="391" y="365" fill="#43D7C6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">U</text><text x="429" y="365" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Unified</text><text x="391" y="405" fill="#AEBBCC" font-family="Inter, Arial, sans-serif" font-size="17">One coherent</text><text x="391" y="432" fill="#AEBBCC" font-family="Inter, Arial, sans-serif" font-size="17">goal + profile</text>
    <rect x="610" y="322" width="218" height="140" rx="22" fill="#101C35" stroke="#6ED98D" stroke-opacity=".55"/><text x="636" y="365" fill="#6ED98D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">E</text><text x="673" y="365" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Editability</text><text x="636" y="405" fill="#AEBBCC" font-family="Inter, Arial, sans-serif" font-size="17">Meals, workouts,</text><text x="636" y="432" fill="#AEBBCC" font-family="Inter, Arial, sans-serif" font-size="17">preferences</text>
