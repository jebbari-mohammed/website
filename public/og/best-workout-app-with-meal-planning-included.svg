<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Best Workout Apps With Meal Plans</title>
  <desc id="desc">IZEM FUEL scorecard for comparing workout and meal-planning apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#06101F"/><stop offset="1" stop-color="#111C37"/></linearGradient>
    <linearGradient id="accent" x1="120" y1="150" x2="1060" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#34D399"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="blur" x="-200" y="-200" width="1600" height="1000"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="160" cy="100" r="180" fill="#22D3EE" fill-opacity=".14" filter="url(#blur)"/>
