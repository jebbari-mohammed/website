<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Workout Consistency Calculator</title>
  <desc id="desc">A premium fitness-tech card showing skip risk, call timing, and fallback workouts.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="1104" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#153D42"/>
    </linearGradient>
    <linearGradient id="accent" x1="246" y1="136" x2="972" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="170" fill="#2DD4BF" fill-opacity=".08"/>
  <circle cx="170" cy="540" r="150" fill="#00B8D9" fill-opacity=".08"/>
  <rect x="76" y="64" width="1048" height="502" rx="30" fill="#0C1A2C" fill-opacity=".9" stroke="#FFFFFF" stroke-opacity=".08" filter="url(#shadow)"/>
  <text x="120" y="150" fill="#8FE8D2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">IZEM</text>
  <text x="120" y="224" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800">Workout Consistency</text>
  <text x="120" y="290" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800">Calculator</text>
  <text x="120" y="352" fill="#C6D2DF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="500">Skip risk, call timing, and fallback workouts</text>
  <rect x="120" y="406" width="310" height="92" rx="22" fill="url(#accent)"/>
  <text x="154" y="447" fill="#052019" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="800">Call before the skip window</text>
  <text x="154" y="481" fill="#052019" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700">Simple, practical accountability</text>
  <rect x="770" y="146" width="230" height="230" rx="28" fill="#07111F" stroke="#FFFFFF" stroke-opacity=".09"/>
  <circle cx="885" cy="261" r="78" fill="none" stroke="#2DD4BF" stroke-width="14" stroke-dasharray="316 120" stroke-linecap="round"/>
  <circle cx="885" cy="261" r="48" fill="#0C1A2C" stroke="rgba(255,255,255,0.08)"/>
  <text x="885" y="257" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="900">68</text>
  <text x="885" y="288" text-anchor="middle" fill="#8FA1B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SKIP RISK</text>
  <rect x="770" y="404" width="230" height="92" rx="22" fill="#0C1A2C" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="798" y="444" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">Fallback plan</text>
  <text x="798" y="472" fill="#C6D2DF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="500">10-20 minute backup</text>
</svg>
